<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRON — Bounce Beat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#000;
  overflow:hidden;
  width:100vw; height:100vh;
  touch-action:none;
  user-select:none;
  font-family:'Courier New',monospace;
}

canvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  display:block;
}

/* ── UI ── */
#ui {
  position:fixed; top:0; left:0;
  width:100%; padding:14px 20px;
  display:flex; justify-content:space-between; align-items:flex-start;
  z-index:10; pointer-events:none;
}
#score {
  font-size:clamp(18px,4.5vw,30px);
  font-weight:900; color:#00f0ff;
  text-shadow:0 0 8px #00f0ff,0 0 20px #00f0ff;
  letter-spacing:3px;
}
#combo {
  font-size:clamp(12px,3vw,20px);
  font-weight:700; color:#ff9900;
  text-shadow:0 0 8px #ff9900;
  opacity:0; transition:opacity .2s;
}
#combo.on { opacity:1; }
#modeBadge {
  position:fixed; bottom:18px; left:50%;
  transform:translateX(-50%);
  font-size:clamp(11px,2.5vw,16px);
  letter-spacing:3px; color:rgba(0,240,255,0.45);
  pointer-events:none; z-index:10;
}

/* ════════════════════════════════
   СТАРТОВЫЙ ЭКРАН
════════════════════════════════ */
#startScreen {
  position:fixed; inset:0;
  background:linear-gradient(180deg,#000510 0%,#000d28 60%,#000510 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0; z-index:50; overflow:hidden;
}
#startScreen::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,240,255,0.025) 2px,rgba(0,240,255,0.025) 4px
  );
  pointer-events:none; z-index:0;
}

#decoCanvas {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; z-index:0;
}

.s-logo {
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:clamp(14px,3vh,30px);
}
.s-logo-sub {
  font-size:clamp(10px,2vw,14px);
  letter-spacing:8px; color:#0088aa;
  margin-bottom:6px;
}
.s-logo h1 {
  font-size:clamp(48px,11vw,90px);
  font-weight:900; letter-spacing:10px;
  color:transparent;
  background:linear-gradient(180deg,#ffffff 0%,#00f0ff 40%,#0066cc 100%);
  -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 18px rgba(0,240,255,.9)) drop-shadow(0 0 40px rgba(0,100,255,.6));
  animation:logoGlow 2.5s ease-in-out infinite alternate;
}
.s-logo-line {
  width:clamp(160px,36vw,300px); height:2px;
  background:linear-gradient(90deg,transparent,#00f0ff,transparent);
  box-shadow:0 0 12px #00f0ff;
  margin-top:8px;
}

.s-tagline {
  position:relative; z-index:1;
  font-size:clamp(10px,2.2vw,14px);
  letter-spacing:3px; color:rgba(0,240,255,0.6);
  margin-bottom:clamp(18px,3.5vh,34px);
  text-align:center;
}

/* Карточки режимов */
.s-modes {
  position:relative; z-index:1;
  display:flex; gap:clamp(8px,1.8vw,18px);
  flex-wrap:wrap; justify-content:center;
  padding:0 16px;
  margin-bottom:clamp(18px,3.5vh,32px);
}

.mode-card {
  width:clamp(120px,20vw,190px);
  border:1.5px solid rgba(0,240,255,0.2);
  border-radius:6px;
  padding:clamp(12px,2vh,20px) clamp(8px,1.2vw,16px);
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  background:rgba(0,15,50,0.6);
  backdrop-filter:blur(4px);
  transition:border-color .2s, box-shadow .2s, transform .2s, background .2s;
  position:relative; overflow:hidden;
  /* ВАЖНО: изолируем события */
  -webkit-tap-highlight-color:transparent;
}
.mode-card::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,240,255,0.07),transparent);
  opacity:0; transition:opacity .2s; pointer-events:none;
}
.mode-card:hover { transform:translateY(-2px); }
.mode-card:hover::before { opacity:1; }

/* Выбранная карточка */
.mode-card.selected {
  border-color:#00f0ff;
  background:rgba(0,40,100,0.75);
  box-shadow:0 0 22px rgba(0,240,255,0.4),inset 0 0 18px rgba(0,240,255,0.08);
  transform:translateY(-3px);
}
.mode-card.selected::before { opacity:1; }

.mode-icon { font-size:clamp(20px,3.5vw,30px); line-height:1; }
.mode-name {
  font-size:clamp(11px,2.2vw,15px);
  font-weight:900; letter-spacing:3px; color:#00f0ff;
  text-shadow:0 0 8px #00f0ff;
}
.mode-desc {
  font-size:clamp(8px,1.6vw,11px);
  color:rgba(0,240,255,0.55);
  text-align:center; letter-spacing:1px; line-height:1.5;
}
.mode-tag {
  font-size:clamp(7px,1.3vw,10px);
  letter-spacing:2px; padding:3px 8px;
  border-radius:20px; font-weight:700;
}
.tag-free { background:rgba(0,255,136,0.18); color:#00ff88; border:1px solid #00ff88; }
.tag-easy { background:rgba(255,153,0,0.18);  color:#ff9900; border:1px solid #ff9900; }
.tag-hard { background:rgba(255,0,60,0.18);   color:#ff003c; border:1px solid #ff003c; }

/* Кнопка СТАРТ */
#btnStart {
  position:relative; z-index:2;
  padding:clamp(12px,2vh,16px) clamp(38px,7vw,60px);
  font:900 clamp(13px,2.8vw,18px)/1 'Courier New',monospace;
  letter-spacing:5px; color:#000a1a;
  background:linear-gradient(135deg,#00f0ff,#0088cc);
  border:none; border-radius:4px; cursor:pointer;
  box-shadow:0 0 28px rgba(0,240,255,0.8),0 0 60px rgba(0,120,255,0.4);
  transition:transform .15s, box-shadow .15s;
  /* pointer-events включены явно */
  pointer-events:auto;
}
#btnStart:hover {
  transform:scale(1.05);
  box-shadow:0 0 40px rgba(0,240,255,1),0 0 80px rgba(0,120,255,0.6);
}
#btnStart:active { transform:scale(0.95); }

/* ════════════════════════════════
   GAME OVER
════════════════════════════════ */
#dieScreen {
  position:fixed; inset:0;
  background:rgba(0,4,16,0.93);
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; z-index:50;
}
#dieScreen::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(255,0,60,0.03) 2px,rgba(255,0,60,0.03) 4px
  );
  pointer-events:none;
}
#dieScreen h2 {
  font-size:clamp(28px,7vw,58px);
  font-weight:900; letter-spacing:5px; color:#ff003c;
  text-shadow:0 0 20px #ff003c,0 0 50px #ff003c;
  position:relative;
}
.die-stat {
  font-size:clamp(15px,3.5vw,24px);
  font-weight:700; letter-spacing:2px;
  color:#00f0ff; text-shadow:0 0 8px #00f0ff;
  position:relative;
}
.die-stat.best { color:#ff9900; text-shadow:0 0 8px #ff9900; }
.die-mode {
  font-size:clamp(10px,2vw,14px);
  letter-spacing:3px; color:rgba(0,240,255,0.45);
  position:relative;
}
#btnRestart {
  position:relative;
  padding:clamp(11px,2vh,15px) clamp(36px,7vw,56px);
  font:900 clamp(13px,2.8vw,18px)/1 'Courier New',monospace;
  letter-spacing:4px; color:#000a1a;
  background:linear-gradient(135deg,#00f0ff,#0088cc);
  border:none; border-radius:4px; cursor:pointer;
  box-shadow:0 0 22px rgba(0,240,255,0.75);
  transition:transform .15s;
  margin-top:6px; pointer-events:auto;
}
#btnRestart:hover  { transform:scale(1.05); }
#btnRestart:active { transform:scale(.95); }

@keyframes logoGlow {
  from { filter:drop-shadow(0 0 14px rgba(0,240,255,.8)) drop-shadow(0 0 35px rgba(0,100,255,.5)); }
  to   { filter:drop-shadow(0 0 30px rgba(0,240,255,1))  drop-shadow(0 0 70px rgba(0,150,255,.8)); }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="combo"></div>
</div>
<div id="modeBadge"></div>

<!-- ══ СТАРТ ══ -->
<div id="startScreen">
  <canvas id="decoCanvas"></canvas>

  <div class="s-logo">
    <div class="s-logo-sub">GRID PROTOCOL</div>
    <h1>TRON</h1>
    <div class="s-logo-line"></div>
  </div>

  <div class="s-tagline">BOUNCE BEAT — SELECT DIFFICULTY</div>

  <div class="s-modes" id="sModes">
    <div class="mode-card selected" data-mode="free">
      <div class="mode-icon">∞</div>
      <div class="mode-name">FREE</div>
      <div class="mode-desc">Без препятствий<br>чистый ритм</div>
      <div class="mode-tag tag-free">TRAINING</div>
    </div>
    <div class="mode-card" data-mode="easy">
      <div class="mode-icon">◈</div>
      <div class="mode-name">GRID</div>
      <div class="mode-desc">Высокий прыжок<br>редкие барьеры</div>
      <div class="mode-tag tag-easy">STANDARD</div>
    </div>
    <div class="mode-card" data-mode="hard">
      <div class="mode-icon">⬡</div>
      <div class="mode-name">MASTER</div>
      <div class="mode-desc">Быстрее, гуще<br>серьёзный вызов</div>
      <div class="mode-tag tag-hard">MASTER</div>
    </div>
  </div>

  <button id="btnStart">ENTER GRID</button>
</div>

<!-- ══ GAME OVER ══ -->
<div id="dieScreen">
  <h2>DEREZZED</h2>
  <div class="die-stat" id="statScore"></div>
  <div class="die-stat best" id="statBest"></div>
  <div class="die-mode" id="statMode"></div>
  <button id="btnRestart">REBOOT</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  ВЫБОР РЕЖИМА — вся логика здесь, без onclick в HTML
// ═══════════════════════════════════════════════════════════
let selectedMode = 'free';

// Навешиваем обработчики на карточки через JS (не onclick атрибут)
document.querySelectorAll('.mode-card').forEach(function(card) {
  function pick(e) {
    e.stopPropagation();
    // Убираем selected у всех
    document.querySelectorAll('.mode-card').forEach(function(c) {
      c.classList.remove('selected');
    });
    // Ставим selected только этой
    card.classList.add('selected');
    selectedMode = card.getAttribute('data-mode');
  }
  card.addEventListener('click',     pick);
  card.addEventListener('touchend',  function(e){ e.preventDefault(); pick(e); });
});

// ═══════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════
const CV  = document.getElementById('c');
const CTX = CV.getContext('2d');

let W=0,H=0,GY=0,BR=0,BX=0,GR=0,JV=0,DV=0,SPD=0;

function onResize(){
  W  = CV.width  = window.innerWidth;
  H  = CV.height = window.innerHeight;
  GY = H * 0.80;
  BR = Math.max(14, Math.min(W,H)*0.07);
  BX = W * 0.28;
  applyModePhysics();
  buildFloor();
  // Также ресайз дека-канваса
  const dc = document.getElementById('decoCanvas');
  dc.width  = window.innerWidth;
  dc.height = window.innerHeight;
}
window.addEventListener('resize', onResize);

// ═══════════════════════════════════════════════════════════
//  КОНФИГИ РЕЖИМОВ
// ═══════════════════════════════════════════════════════════
const MODES = {
  free: {
    label      : 'FREE RIDE',
    jumpMult   : 1.55,
    djumpMult  : 1.4,
    gravMult   : 0.90,
    obsEnabled : false,
    obsInterval: 99999,
    obsMinH    : 0,
    obsMaxH    : 0,
    speedMult  : 0.85,
    accelRate  : 0
  },
  easy: {
    label      : 'STANDARD GRID',
    jumpMult   : 1.60,
    djumpMult  : 1.45,
    gravMult   : 0.88,
    obsEnabled : true,
    obsInterval: 2.4,
    obsMinH    : 0.08,
    obsMaxH    : 0.14,
    speedMult  : 0.90,
    accelRate  : 0.08
  },
  hard: {
    label      : 'MASTER CIRCUIT',
    jumpMult   : 1.15,
    djumpMult  : 1.0,
    gravMult   : 1.10,
    obsEnabled : true,
    obsInterval: 1.6,
    obsMinH    : 0.13,
    obsMaxH    : 0.22,
    speedMult  : 1.20,
    accelRate  : 0.14
  }
};

let modeConf = MODES.free;

function applyModePhysics(){
  const c = modeConf;
  GR  = H * 0.0014 * c.gravMult;
  JV  = -(H * 0.022 * c.jumpMult);
  DV  = -(H * 0.016 * c.djumpMult);
  SPD = W * 0.007  * c.speedMult * gameSpd;
}

// ═══════════════════════════════════════════════════════════
//  ИГРОВОЕ СОСТОЯНИЕ
// ═══════════════════════════════════════════════════════════
// 'menu' | 'play' | 'dead'
let GMODE = 'menu';

let score = 0;
let best  = { free:0, easy:0, hard:0 };
let combo = 0;
let gameSpd = 1, spdTm = 0;
let obsInt = 0, nextObs = 0;

// Шарик
let by=0, bvy=0, bOnGround=true, bCanDJ=false;

// Объекты
let obs=[], parts=[], floor=[];
let flOff=0, gridOff=0;

// Фон
const BG_DARK = '#000510';
const BG_POOL = [
  '#000510','#000818','#000c20','#000416','#010720',
  '#020010','#000308','#020616','#030020','#010515',
  '#080005','#100005','#0a0002','#0f0018','#060012'
];
let bgCur=BG_DARK, bgTgt=BG_DARK, bgT=1;

const NEON = ['#00f0ff','#ff9900','#ff003c','#00ff88','#cc33ff','#ffee00','#ff00aa','#00aaff'];
const BPM=120, BEAT_MS=60000/BPM;

let rafId=0, prevTs=0;

// ═══════════════════════════════════════════════════════════
//  ЗВЁЗДЫ
// ═══════════════════════════════════════════════════════════
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<80;i++) stars.push({
    x:Math.random()*W, y:Math.random()*GY*0.9,
    r:Math.random()*1.2+0.3,
    a:Math.random()*0.6+0.2,
    fl:Math.random()*Math.PI*2,
    fs:0.02+Math.random()*0.03
  });
}

// ═══════════════════════════════════════════════════════════
//  ПОЛ
// ═══════════════════════════════════════════════════════════
function buildFloor(){
  floor=[];
  const n=28;
  for(let i=0;i<n;i++) floor.push({
    rx   : i*(W*2/n)+Math.random()*20,
    color: NEON[Math.floor(Math.random()*NEON.length)],
    w    : 1+Math.random()*2.5
  });
}

// ═══════════════════════════════════════════════════════════
//  ДЕКОРАТИВНЫЙ CANVAS (лазеры на старт-экране)
// ═══════════════════════════════════════════════════════════
let decoLines=[], decoRaf=0;
const DC  = document.getElementById('decoCanvas');
const DCX = DC.getContext('2d');

function newDecoLine(){
  return {
    x1:Math.random()<0.5?0:DC.width,
    y1:Math.random()*DC.height,
    x2:Math.random()*DC.width,
    y2:Math.random()*DC.height,
    col:NEON[Math.floor(Math.random()*NEON.length)],
    life:0, maxLife:120+Math.random()*180
  };
}
function startDeco(){
  DC.width=window.innerWidth; DC.height=window.innerHeight;
  decoLines=[];
  for(let i=0;i<18;i++) decoLines.push(newDecoLine());
  function tick(){
    if(GMODE!=='menu'){ DCX.clearRect(0,0,DC.width,DC.height); return; }
    decoRaf=requestAnimationFrame(tick);
    DCX.clearRect(0,0,DC.width,DC.height);
    decoLines.forEach((l,i)=>{
      l.life++;
      if(l.life>l.maxLife) decoLines[i]=newDecoLine();
      const p=l.life/l.maxLife;
      const a=p<0.3?p/0.3:p>0.7?(1-p)/0.3:1;
      DCX.save();
      DCX.strokeStyle=l.col; DCX.lineWidth=1;
      DCX.globalAlpha=a*0.32;
      DCX.shadowColor=l.col; DCX.shadowBlur=8;
      DCX.beginPath(); DCX.moveTo(l.x1,l.y1); DCX.lineTo(l.x2,l.y2); DCX.stroke();
      DCX.restore();
    });
  }
  tick();
}

// ═══════════════════════════════════════════════════════════
//  АУДИО
// ═══════════════════════════════════════════════════════════
let AC=null, MG=null, nextBeat=0, beatTmr=null, bassI=0;

function initAudio(){
  if(AC) return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain(); MG.gain.value=0.35; MG.connect(AC.destination);
}
function startMusic(){
  if(!AC) return;
  bassI=0; nextBeat=AC.currentTime+0.05; beatTick();
}
function stopMusic(){ if(beatTmr){ clearTimeout(beatTmr); beatTmr=null; } }

function beatTick(){
  if(GMODE!=='play') return;
  while(nextBeat<AC.currentTime+0.5){
    kick(nextBeat); playBass(nextBeat);
    const bi=Math.round(nextBeat/(BEAT_MS/1000));
    if(bi%2===1) snare(nextBeat);
    hihat(nextBeat);
    nextBeat+=BEAT_MS/1000;
  }
  beatTmr=setTimeout(beatTick,150);
}

function mkOsc(type,freq,gainV,t,dur){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  o.connect(g); g.connect(MG);
  g.gain.setValueAtTime(gainV,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.01);
}
function mkNoise(gainV,t,dur,bpFreq){
  const len=Math.ceil(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass'; f.frequency.value=bpFreq; f.Q.value=0.8;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(MG);
  g.gain.setValueAtTime(gainV,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.start(t); s.stop(t+dur+0.01);
}

function kick(t)  { mkOsc('sine',155,1,t,0.4); }
function snare(t) { mkNoise(0.28,t,0.13,1800); }
function hihat(t) { mkNoise(0.09,t,0.04,9000); }
const BASS_NOTES=[55,55,73.4,55,65.4,55,82.4,55];
function playBass(t){ mkOsc('sawtooth',BASS_NOTES[bassI%BASS_NOTES.length],0.20,t,0.28); bassI++; }

function sfxJump(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.connect(g); g.connect(MG);
  o.frequency.setValueAtTime(280,t);
  o.frequency.exponentialRampToValueAtTime(560,t+0.09);
  g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.start(t); o.stop(t+0.13);
}
function sfxLand(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.connect(g); g.connect(MG);
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(70,t+0.1);
  g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.start(t); o.stop(t+0.14);
}
function sfxDie(){
  if(!AC) return;
  [200,160,120,85].forEach(function(f,i){
    mkOsc('sawtooth',f,0.28,AC.currentTime+i*0.1,0.18);
  });
}

// ═══════════════════════════════════════════════════════════
//  ПРЫЖОК
// ═══════════════════════════════════════════════════════════
function jump(){
  if(GMODE!=='play') return;
  if(bOnGround){
    bvy=JV; bOnGround=false; bCanDJ=true; sfxJump();
  } else if(bCanDJ){
    bvy=Math.min(bvy-0.2,DV); bCanDJ=false; sfxJump(); djParticles();
  }
}

// ═══════════════════════════════════════════════════════════
//  ЧАСТИЦЫ
// ═══════════════════════════════════════════════════════════
function landParticles(){
  for(let i=0;i<14;i++){
    const a=Math.PI+(Math.random()-.5)*Math.PI*0.9;
    const s=1.5+Math.random()*4.5;
    parts.push({x:BX,y:GY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,
      life:1,dec:.04+Math.random()*.04,r:2.5+Math.random()*3.5,
      col:NEON[Math.floor(Math.random()*NEON.length)]});
  }
}
function djParticles(){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    parts.push({x:BX+(Math.random()-.5)*BR*2,y:by+BR,
      vx:Math.cos(a)*s,vy:Math.sin(a)*s+1,
      life:1,dec:.06+Math.random()*.05,r:2+Math.random()*3,col:'#cc33ff'});
  }
}

// ═══════════════════════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ═══════════════════════════════════════════════════════════
function spawnObs(){
  if(!modeConf.obsEnabled) return;
  const twin=Math.random()<0.28;
  const minH=GY*modeConf.obsMinH, maxH=GY*modeConf.obsMaxH;
  const h1=minH+Math.random()*(maxH-minH);
  const obW=Math.max(7,W*0.013);
  const c1=NEON[Math.floor(Math.random()*NEON.length)];
  obs.push({x:W+30,w:obW,h:h1,col:c1,passed:false});
  if(twin){
    const gap=obW+W*(0.04+Math.random()*0.03);
    obs.push({x:W+30+gap,w:obW,
      h:minH+Math.random()*(maxH-minH)*(0.7+Math.random()*0.6),
      col:NEON[Math.floor(Math.random()*NEON.length)],passed:false});
  }
}

function hitObs(o){
  const bL=BX-BR+5,bR=BX+BR-5;
  const bT=by-BR+5,bB=by+BR-5;
  return bR>o.x && bL<o.x+o.w && bB>GY-o.h && bT<GY;
}

// ═══════════════════════════════════════════════════════════
//  ЦВЕТ ФОНА
// ═══════════════════════════════════════════════════════════
function pickBg(){
  let c; do{ c=BG_POOL[Math.floor(Math.random()*BG_POOL.length)]; }while(c===bgTgt);
  bgTgt=c; bgT=0;
}
function lerpClr(a,b,t){
  function p(s){ return {r:parseInt(s.slice(1,3),16),g:parseInt(s.slice(3,5),16),b:parseInt(s.slice(5,7),16)}; }
  const ca=p(a),cb=p(b);
  return 'rgb('+Math.round(ca.r+(cb.r-ca.r)*t)+','+Math.round(ca.g+(cb.g-ca.g)*t)+','+Math.round(ca.b+(cb.b-ca.b)*t)+')';
}

// ═══════════════════════════════════════════════════════════
//  СТАРТ ИГРЫ
// ═══════════════════════════════════════════════════════════
function startGame(){
  // Скрываем стартовый экран
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('dieScreen').style.display   = 'none';

  modeConf = MODES[selectedMode];
  GMODE    = 'play';

  score=0; combo=0; gameSpd=1; spdTm=0;
  obs=[]; parts=[]; flOff=0; gridOff=0;
  obsInt=BEAT_MS*modeConf.obsInterval;
  bgCur=BG_DARK; bgTgt=BG_DARK; bgT=1;
  bassI=0;

  onResize();   // пересчитывает физику через applyModePhysics
  initStars();
  buildFloor();

  by=GY-BR; bvy=0; bOnGround=true; bCanDJ=false;
  nextObs=performance.now()+BEAT_MS*3.5;

  document.getElementById('score').textContent = '0';
  document.getElementById('combo').className   = '';
  document.getElementById('modeBadge').textContent = modeConf.label;

  stopMusic();
  startMusic();

  // Останавливаем deco-loop
  cancelAnimationFrame(decoRaf);
  decoRaf=0;
  DCX.clearRect(0,0,DC.width,DC.height);
}

// ═══════════════════════════════════════════════════════════
//  GAME OVER
// ═══════════════════════════════════════════════════════════
function dieGame(){
  GMODE='dead';
  sfxDie(); stopMusic();
  if(score>best[selectedMode]) best[selectedMode]=score;
  document.getElementById('statScore').textContent = 'ОЧКИ: '+score;
  document.getElementById('statBest').textContent  = 'РЕКОРД: '+best[selectedMode];
  document.getElementById('statMode').textContent  = modeConf.label;
  document.getElementById('dieScreen').style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════
//  РЕСТАРТ (из game over)
// ═══════════════════════════════════════════════════════════
function restartGame(){
  // Режим уже выбран, просто перезапускаем
  startGame();
}

// ═══════════════════════════════════════════════════════════
//  КНОПКИ — только здесь, никаких onclick в HTML
// ═══════════════════════════════════════════════════════════
(function(){
  var btnStart   = document.getElementById('btnStart');
  var btnRestart = document.getElementById('btnRestart');

  function onStart(e){
    e.preventDefault();
    e.stopPropagation();
    initAudio();
    startGame();
  }
  function onRestart(e){
    e.preventDefault();
    e.stopPropagation();
    initAudio();
    restartGame();
  }

  btnStart.addEventListener('click',    onStart);
  btnStart.addEventListener('touchend', onStart);

  btnRestart.addEventListener('click',    onRestart);
  btnRestart.addEventListener('touchend', onRestart);
})();

// ═══════════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ (прыжок) — только на canvas, не на UI
// ═══════════════════════════════════════════════════════════
CV.addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  if(GMODE==='play') jump();
});
CV.addEventListener('touchstart', function(e){
  e.preventDefault();
  e.stopPropagation();
  initAudio();
  if(GMODE==='play') jump();
}, {passive:false});

document.addEventListener('keydown', function(e){
  if(e.code!=='Space' && e.code!=='ArrowUp') return;
  e.preventDefault();
  initAudio();
  if(GMODE==='play') jump();
});

// ═══════════════════════════════════════════════════════════
//  ГЛАВНЫЙ ЦИКЛ
// ═══════════════════════════════════════════════════════════
function loop(ts){
  rafId = requestAnimationFrame(loop);
  const dt = prevTs ? Math.min(ts-prevTs,50) : 16;
  prevTs = ts;
  const f  = dt/16.667;

  if(GMODE==='play'){
    // Разгон
    if(modeConf.obsEnabled && modeConf.accelRate>0){
      spdTm+=dt;
      if(spdTm>9000){
        spdTm=0;
        gameSpd=Math.min(gameSpd+modeConf.accelRate,2.8);
        applyModePhysics();
        obsInt=Math.max(BEAT_MS*0.75,obsInt-50);
      }
    }

    bgT=Math.min(1,bgT+0.055*f);

    // Физика шарика
    if(!bOnGround){
      bvy+=GR*f; by+=bvy*f;
      if(by>=GY-BR){
        by=GY-BR; bvy=0; bOnGround=true; bCanDJ=false;
        sfxLand(); landParticles(); pickBg();
        combo=0;
        document.getElementById('combo').className='';
      }
    }

    // Скролл
    flOff   = (flOff  +SPD*f)%(W*2);
    gridOff = (gridOff+SPD*f*0.5)%(W/4);

    // Спавн
    if(ts>=nextObs){ spawnObs(); nextObs=ts+obsInt; }

    // Обновление препятствий
    for(var i=obs.length-1;i>=0;i--){
      obs[i].x-=SPD*f;
      if(!obs[i].passed && obs[i].x+obs[i].w<BX-BR){
        obs[i].passed=true; combo++;
        score+=10+combo*2;
        document.getElementById('score').textContent=score;
        if(combo>=3){
          var el=document.getElementById('combo');
          el.textContent='COMBO ×'+combo;
          el.className='on';
        }
      }
      if(hitObs(obs[i])){ dieGame(); return; }
      if(obs[i].x+obs[i].w<-40) obs.splice(i,1);
    }

    // Частицы
    for(var i=parts.length-1;i>=0;i--){
      parts[i].x+=parts[i].vx*f;
      parts[i].y+=parts[i].vy*f;
      parts[i].vy+=0.18*f;
      parts[i].life-=parts[i].dec*f;
      if(parts[i].life<=0) parts.splice(i,1);
    }
  }

  render(ts);
}

// ═══════════════════════════════════════════════════════════
//  РЕНДЕР
// ═══════════════════════════════════════════════════════════
function render(ts){
  // Фон
  var bgNow = bgT>=1 ? bgTgt : lerpClr(bgCur,bgTgt,bgT);
  if(bgT>=1) bgCur=bgTgt;
  CTX.fillStyle=bgNow;
  CTX.fillRect(0,0,W,H);

  // Вертикальный оверлей
  var vg=CTX.createLinearGradient(0,0,0,GY);
  vg.addColorStop(0,'rgba(0,0,0,0.55)');
  vg.addColorStop(0.6,'rgba(0,8,30,0.25)');
  vg.addColorStop(1,'rgba(0,20,60,0.12)');
  CTX.fillStyle=vg;
  CTX.fillRect(0,0,W,GY);

  // Звёзды
  stars.forEach(function(s){
    s.fl+=s.fs;
    var a=s.a*(0.7+0.3*Math.sin(s.fl));
    CTX.save();
    CTX.fillStyle='rgba(180,220,255,'+a+')';
    CTX.beginPath(); CTX.arc(s.x,s.y,s.r,0,Math.PI*2); CTX.fill();
    CTX.restore();
  });

  // Горизонт glow
  CTX.save();
  var hg=CTX.createLinearGradient(0,GY-H*0.12,0,GY);
  hg.addColorStop(0,'rgba(0,80,180,0)');
  hg.addColorStop(1,'rgba(0,80,255,0.18)');
  CTX.fillStyle=hg; CTX.fillRect(0,GY-H*0.12,W,H*0.12);
  CTX.restore();

  // Сканлайны
  CTX.fillStyle='rgba(0,0,0,0.055)';
  for(var y=0;y<GY;y+=4) CTX.fillRect(0,y,W,2);

  // Пол
  drawFloor();

  // Частицы
  parts.forEach(function(p){
    CTX.save();
    CTX.globalAlpha=p.life;
    CTX.fillStyle=p.col; CTX.shadowColor=p.col; CTX.shadowBlur=10;
    CTX.beginPath(); CTX.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); CTX.fill();
    CTX.restore();
  });

  // Препятствия
  obs.forEach(function(o){
    var yt=GY-o.h;
    CTX.save();
    CTX.fillStyle=o.col; CTX.shadowColor=o.col; CTX.shadowBlur=20;
    CTX.fillRect(o.x,yt,o.w,o.h);
    CTX.shadowBlur=0; CTX.fillStyle='#fff';
    CTX.fillRect(o.x,yt,o.w,3);
    CTX.restore();
  });

  // Шарик
  drawBall();

  // Beat-пульс
  if(GMODE==='play'){
    var ph=(ts%BEAT_MS)/BEAT_MS;
    var pv=Math.max(0,1-ph*5);
    if(pv>0){
      CTX.fillStyle='rgba(0,240,255,'+(pv*0.05).toFixed(3)+')';
      CTX.fillRect(0,0,W,H);
    }
  }
}

function drawFloor(){
  // Чёрная плоскость
  CTX.fillStyle='#000';
  CTX.fillRect(0,GY,W,H-GY);

  // Перспективная сетка
  CTX.save();
  var vpX=W*0.5, vpY=GY;
  var segs=14;
  CTX.shadowColor='#00f0ff'; CTX.shadowBlur=4;
  for(var i=0;i<=segs;i++){
    var t2=i/segs;
    var bx=t2*W;
    var alpha=0.10+Math.abs((bx-vpX)/(W*0.5))*0.04;
    CTX.strokeStyle='rgba(0,240,255,'+alpha+')';
    CTX.lineWidth=1;
    CTX.beginPath(); CTX.moveTo(vpX,vpY); CTX.lineTo(bx,H); CTX.stroke();
  }
  for(var r=1;r<=8;r++){
    var depth=r/8;
    var py=GY+(H-GY)*Math.pow(depth,1.6);
    CTX.strokeStyle='rgba(0,240,255,'+(0.06+depth*0.14)+')';
    CTX.lineWidth=1; CTX.shadowBlur=depth>0.7?6:2;
    CTX.beginPath(); CTX.moveTo(0,py); CTX.lineTo(W,py); CTX.stroke();
  }
  CTX.restore();

  // Граница
  CTX.save();
  CTX.strokeStyle='#00f0ff'; CTX.lineWidth=3;
  CTX.shadowColor='#00f0ff'; CTX.shadowBlur=20;
  CTX.beginPath(); CTX.moveTo(0,GY); CTX.lineTo(W,GY); CTX.stroke();
  CTX.restore();

  // Цветные полосы
  CTX.save();
  var totalW=W*2;
  floor.forEach(function(t){
    var dx=((t.rx-flOff)%totalW+totalW)%totalW;
    if(dx>W+10) return;
    CTX.strokeStyle=t.color; CTX.lineWidth=t.w;
    CTX.shadowColor=t.color; CTX.shadowBlur=8; CTX.globalAlpha=0.7;
    CTX.beginPath(); CTX.moveTo(dx,GY+4); CTX.lineTo(dx,H); CTX.stroke();
  });
  CTX.restore();
}

function drawBall(){
  var x=BX,y=by,r=BR;
  var lift=Math.max(0,GY-y-r);
  var sc=Math.max(0.1,1-lift/(H*0.4));

  // Тень
  CTX.save();
  CTX.globalAlpha=0.35*sc;
  CTX.fillStyle='#000';
  CTX.beginPath(); CTX.ellipse(x,GY+5,r*sc,r*0.22*sc,0,0,Math.PI*2); CTX.fill();
  CTX.restore();

  // Glow
  CTX.save();
  var grd=CTX.createRadialGradient(x,y,r*0.2,x,y,r*2.8);
  grd.addColorStop(0,'rgba(204,51,255,0.32)');
  grd.addColorStop(0.4,'rgba(160,0,255,0.10)');
  grd.addColorStop(1,'rgba(100,0,200,0)');
  CTX.fillStyle=grd;
  CTX.beginPath(); CTX.arc(x,y,r*2.8,0,Math.PI*2); CTX.fill();
  CTX.restore();

  // Ring
  CTX.save();
  CTX.strokeStyle='rgba(220,100,255,0.6)';
  CTX.lineWidth=3;
  CTX.shadowColor='#cc33ff'; CTX.shadowBlur=16;
  CTX.beginPath(); CTX.arc(x,y,r+4,0,Math.PI*2); CTX.stroke();
  CTX.restore();

  // Тело
  CTX.save();
  var bg2=CTX.createRadialGradient(x-r*0.25,y-r*0.25,r*0.05,x,y,r);
  bg2.addColorStop(0,'#ee88ff');
  bg2.addColorStop(0.4,'#cc33ff');
  bg2.addColorStop(1,'#660099');
  CTX.fillStyle=bg2;
  CTX.shadowColor='#cc33ff'; CTX.shadowBlur=24;
  CTX.beginPath(); CTX.arc(x,y,r,0,Math.PI*2); CTX.fill();
  CTX.restore();

  // Блик
  CTX.save();
  CTX.fillStyle='rgba(255,255,255,0.55)';
  CTX.beginPath();
  CTX.ellipse(x-r*0.28,y-r*0.30,r*0.22,r*0.12,-0.5,0,Math.PI*2);
  CTX.fill();
  CTX.restore();
}

// ═══════════════════════════════════════════════════════════
//  ЗАПУСК
// ═══════════════════════════════════════════════════════════
onResize();
initStars();
by=GY-BR; bvy=0; bOnGround=true; GMODE='menu';

// Единый rAF — крутится всегда
rafId = requestAnimationFrame(loop);

// Декоративные лучи на старт-экране
startDeco();
</script>
