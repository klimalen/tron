<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bounce Beat</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

body {
overflow: hidden;
background: #1a0533;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
width: 100vw;
height: 100vh;
font-family: 'Arial', sans-serif;
touch-action: none;
}

#gameCanvas {
display: block;
cursor: pointer;
}

#ui {
position: fixed;
top: 0;
left: 0;
width: 100%;
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 20px;
z-index: 10;
pointer-events: none;
}

#score {
font-size: clamp(18px, 4vw, 28px);
font-weight: 900;
color: #ffffff;
text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.4);
letter-spacing: 2px;
}

#combo {
font-size: clamp(14px, 3vw, 20px);
font-weight: 700;
color: #ffdd00;
text-shadow: 0 0 10px rgba(255,221,0,0.9);
opacity: 0;
transition: opacity 0.3s;
}

#combo.visible {
opacity: 1;
}

#startScreen {
position: fixed;
inset: 0;
background: rgba(10, 2, 20, 0.92);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 100;
gap: 20px;
}

#startScreen h1 {
font-size: clamp(32px, 8vw, 64px);
font-weight: 900;
color: #fff;
text-shadow: 0 0 20px #a020f0, 0 0 40px #a020f0;
letter-spacing: 4px;
animation: pulse 1.5s ease-in-out infinite;
}

#startScreen p {
font-size: clamp(14px, 3vw, 20px);
color: rgba(255,255,255,0.7);
text-align: center;
padding: 0 20px;
line-height: 1.6;
}

#startBtn {
margin-top: 10px;
padding: 16px 48px;
font-size: clamp(16px, 3.5vw, 22px);
font-weight: 900;
letter-spacing: 3px;
color: #fff;
background: linear-gradient(135deg, #a020f0, #ff0080);
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 0 30px rgba(160, 32, 240, 0.8);
transition: transform 0.15s, box-shadow 0.15s;
pointer-events: auto;
}

#startBtn:hover {
transform: scale(1.05);
box-shadow: 0 0 50px rgba(160, 32, 240, 1);
}

#startBtn:active {
transform: scale(0.97);
}

#gameOver {
position: fixed;
inset: 0;
background: rgba(10, 2, 20, 0.9);
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 100;
gap: 16px;
}

#gameOver h2 {
font-size: clamp(28px, 7vw, 56px);
font-weight: 900;
color: #ff0055;
text-shadow: 0 0 20px #ff0055;
letter-spacing: 3px;
}

#finalScore {
font-size: clamp(20px, 4.5vw, 36px);
color: #fff;
font-weight: 700;
}

#bestScore {
font-size: clamp(14px, 3vw, 22px);
color: #ffdd00;
text-shadow: 0 0 10px rgba(255,221,0,0.7);
}

#restartBtn {
margin-top: 10px;
padding: 14px 44px;
font-size: clamp(15px, 3vw, 20px);
font-weight: 900;
letter-spacing: 2px;
color: #fff;
background: linear-gradient(135deg, #ff0055, #a020f0);
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 0 30px rgba(255, 0, 85, 0.7);
transition: transform 0.15s;
pointer-events: auto;
}

#restartBtn:hover { transform: scale(1.05); }
#restartBtn:active { transform: scale(0.97); }

@keyframes pulse {
0%, 100% { text-shadow: 0 0 20px #a020f0, 0 0 40px #a020f0; }
50% { text-shadow: 0 0 30px #ff0080, 0 0 60px #ff0080, 0 0 80px #ff0080; }
}
</style>
</head>
<body>

<div id="ui">
<div id="score">0</div>
<div id="combo"></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
<h1>BOUNCE BEAT</h1>
<p>Прыгай через линии в ритм музыки<br>
<strong style="color:#ffdd00">Клик / Пробел / Тап</strong> — прыжок<br>
<strong style="color:#00ffcc">Двойной клик в воздухе</strong> — импульс вверх</p>
<button id="startBtn">ИГРАТЬ</button>
</div>

<div id="gameOver">
<h2>GAME OVER</h2>
<div id="finalScore"></div>
<div id="bestScore"></div>
<button id="restartBtn">СНОВА</button>
</div>

<script>
// ============================================================
// КОНСТАНТЫ
// ============================================================
const COLORS = [
'#FF0000','#FF1A00','#FF3300','#FF4D00','#FF6600',
'#FF8000','#FF9900','#FFB300','#FFCC00','#FFE600',
'#CCFF00','#99FF00','#66FF00','#33FF00','#00FF00',
'#00FF33','#00FF66','#00FF99','#00FFCC','#00FFFF',
'#00CCFF','#0099FF','#0066FF','#0033FF','#0000FF',
'#1A00FF','#3300FF','#6600FF','#9900FF','#CC00FF',
'#FF00FF','#FF00CC','#FF0099','#FF0066','#FF0033',
'#FF0055','#FF2255','#FF4455','#FF6677','#FF3388',
'#CC0066','#990066','#660033','#330033','#660099',
'#9900CC','#CC33FF','#FF66FF','#FF33CC','#CC0099',
'#007700','#005500','#003399','#660000','#993300',
'#996600','#009999','#006666','#CC6600','#FF6600'
];

const GROUND_HEIGHT_RATIO = 0.22; // высота "земли" от нижнего края
const BALL_RADIUS_RATIO = 0.035;
const JUMP_VELOCITY_RATIO = 0.022; // начальная скорость прыжка (от высоты canvas)
const GRAVITY_RATIO = 0.0012;
const DOUBLE_JUMP_RATIO = 0.017;
const GROUND_SPEED_BASE = 4.5; // px/frame при 60fps (масштабируется)
const BPM = 120;
const BEAT_MS = 60000 / BPM;
const OBSTACLE_WIDTH_RATIO= 0.018;
const CRACK_COUNT = 18;
const PARTICLE_POOL_SIZE = 120;

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let canvas, ctx, W, H;
let groundY, ballRadius, jumpVelocity, gravity, doubleJumpVelocity, groundSpeed;

let ball = { x: 0, y: 0, vy: 0, onGround: true, canDoubleJump: false, jumpCount: 0 };
let obstacles = [];
let cracks = [];
let particles = [];
let bgColor = '#1a0533';
let targetBgColor = '#1a0533';
let bgTransition = 0;
let score = 0;
let bestScore = 0;
let combo = 0;
let gameActive = false;
let lastTime = 0;
let animId = null;
let nextObstacleTime = 0;
let obstacleInterval = BEAT_MS * 2;
let groundOffset = 0;
let speed = 1;
let speedTimer = 0;
let crackOffset = 0;

// Audio
let audioCtx = null;
let musicStarted = false;
let beatNodes = [];
let beatScheduled = false;
let nextBeatTime = 0;
let masterGain = null;

// ============================================================
// CANVAS SETUP
// ============================================================
function setupCanvas() {
canvas = document.getElementById('gameCanvas');
ctx = canvas.getContext('2d');
resize();
window.addEventListener('resize', resize);
}

function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;

groundY = H - H * GROUND_HEIGHT_RATIO;
ballRadius = Math.max(12, Math.min(W, H) * BALL_RADIUS_RATIO);
jumpVelocity = H * JUMP_VELOCITY_RATIO;
gravity = H * GRAVITY_RATIO;
doubleJumpVelocity = H * DOUBLE_JUMP_RATIO;
groundSpeed = Math.max(3, W * 0.006) * speed;

if (gameActive) {
ball.x = W * 0.22;
ball.y = groundY - ballRadius;
if (ball.onGround) ball.y = groundY - ballRadius;
}
generateCracks();
}

// ============================================================
// ТРЕЩИНЫ НА ПОВЕРХНОСТИ
// ============================================================
function generateCracks() {
cracks = [];
const segW = W / CRACK_COUNT;
for (let i = 0; i < CRACK_COUNT * 2; i++) {
const x = i * segW + Math.random() * segW;
cracks.push({
x, relX: i * segW,
segments: generateCrackSegments(x, groundY)
});
}
}

function generateCrackSegments(startX, startY) {
const segs = [];
let x = startX, y = startY;
const steps = 3 + Math.floor(Math.random() * 5);
for (let i = 0; i < steps; i++) {
const nx = x + (Math.random() - 0.3) * 40;
const ny = y + Math.random() * 35 + 5;
segs.push({ x1: x, y1: y, x2: nx, y2: ny });
x = nx; y = ny;
if (Math.random() > 0.6) {
segs.push({
x1: x, y1: y,
x2: x + (Math.random() - 0.5) * 30,
y2: y + Math.random() * 20
});
}
}
return segs;
}

// ============================================================
// АУДИО (Web Audio API — синтетическая музыка)
// ============================================================
function initAudio() {
if (audioCtx) return;
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
masterGain = audioCtx.createGain();
masterGain.gain.value = 0.4;
masterGain.connect(audioCtx.destination);
musicStarted = true;
nextBeatTime = audioCtx.currentTime + 0.1;
scheduleBeat();
}

function scheduleBeat() {
if (!audioCtx || !gameActive) return;
const beatSec = BEAT_MS / 1000;
while (nextBeatTime < audioCtx.currentTime + 0.5) {
playKick(nextBeatTime);
playBass(nextBeatTime);
if (Math.round(nextBeatTime / beatSec) % 2 === 0) playSnare(nextBeatTime);
if (Math.round(nextBeatTime / beatSec) % 4 < 2) playHiHat(nextBeatTime);
nextBeatTime += beatSec;
}
setTimeout(scheduleBeat, 200);
}

function playKick(t) {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(masterGain);
osc.frequency.setValueAtTime(150, t);
osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.4);
gain.gain.setValueAtTime(1, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
osc.start(t); osc.stop(t + 0.4);
}

function playSnare(t) {
const bufSize = audioCtx.sampleRate * 0.15;
const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
const src = audioCtx.createBufferSource();
const gain = audioCtx.createGain();
const flt = audioCtx.createBiquadFilter();
flt.type = 'bandpass'; flt.frequency.value = 2000; flt.Q.value = 0.8;
src.buffer = buf;
src.connect(flt); flt.connect(gain); gain.connect(masterGain);
gain.gain.setValueAtTime(0.3, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
src.start(t); src.stop(t + 0.15);
}

function playHiHat(t) {
const bufSize = audioCtx.sampleRate * 0.05;
const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
const data = buf.getChannelData(0);
for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
const src = audioCtx.createBufferSource();
const gain = audioCtx.createGain();
const flt = audioCtx.createBiquadFilter();
flt.type = 'highpass'; flt.frequency.value = 8000;
src.buffer = buf;
src.connect(flt); flt.connect(gain); gain.connect(masterGain);
gain.gain.setValueAtTime(0.12, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
src.start(t); src.stop(t + 0.05);
}

function playBass(t) {
const notes = [55, 55, 73, 55, 65, 55, 82, 55];
const beatIdx = Math.round(t / (BEAT_MS / 1000)) % notes.length;
const freq = notes[beatIdx];
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sawtooth';
osc.connect(gain); gain.connect(masterGain);
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.25, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
osc.start(t); osc.stop(t + 0.35);
}

function playJumpSound() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(masterGain);
osc.type = 'sine';
const t = audioCtx.currentTime;
osc.frequency.setValueAtTime(300, t);
osc.frequency.exponentialRampToValueAtTime(600, t + 0.1);
gain.gain.setValueAtTime(0.2, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
osc.start(t); osc.stop(t + 0.15);
}

function playLandSound() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(masterGain);
osc.type = 'sine';
const t = audioCtx.currentTime;
osc.frequency.setValueAtTime(200, t);
osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
gain.gain.setValueAtTime(0.25, t);
gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
osc.start(t); osc.stop(t + 0.15);
}

function playDeathSound() {
if (!audioCtx) return;
const t = audioCtx.currentTime;
[200, 160, 120, 80].forEach((freq, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(masterGain);
osc.type = 'sawtooth';
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.3, t + i * 0.08);
gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
osc.start(t + i * 0.08);
osc.stop(t + i * 0.08 + 0.2);
});
}

// ============================================================
// ЧАСТИЦЫ
// ============================================================
function spawnLandParticles() {
const count = 10;
for (let i = 0; i < count; i++) {
const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
const speed = 1.5 + Math.random() * 3;
particles.push({
x: ball.x, y: groundY,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed - 1,
life: 1, decay: 0.05 + Math.random() * 0.05,
size: 3 + Math.random() * 4,
color: bgColor
});
}
}

function updateParticles(dt) {
const factor = dt / 16.67;
particles = particles.filter(p => {
p.x += p.vx * factor;
p.y += p.vy * factor;
p.vy += 0.15 * factor;
p.life -= p.decay * factor;
return p.life > 0;
});
}

function drawParticles() {
particles.forEach(p => {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
ctx.fill();
});
ctx.globalAlpha = 1;
}

// ============================================================
// ФОН
// ============================================================
function hexToRgb(hex) {
const r = parseInt(hex.slice(1,3),16);
const g = parseInt(hex.slice(3,5),16);
const b = parseInt(hex.slice(5,7),16);
return {r, g, b};
}

function lerpColor(c1, c2, t) {
const a = hexToRgb(c1), b = hexToRgb(c2);
const r = Math.round(a.r + (b.r - a.r) * t);
const g = Math.round(a.g + (b.g - a.g) * t);
const bv = Math.round(a.b + (b.b - a.b) * t);
return `rgb(${r},${g},${bv})`;
}

function changeBgColor() {
let newColor;
do { newColor = COLORS[Math.floor(Math.random() * COLORS.length)]; }
while (newColor === targetBgColor);
targetBgColor = newColor;
bgTransition = 0;
}

// ============================================================
// ЗЕМЛЯ
// ============================================================
function drawGround() {
const groundTop = groundY;
const tileW = W / 6;

// Основная поверхность
ctx.fillStyle = '#111111';
ctx.fillRect(0, groundTop, W, H - groundTop);

// Горизонтальная яркая линия-граница
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 2;
ctx.shadowColor = '#ffffff';
ctx.shadowBlur = 8;
ctx.beginPath();
ctx.moveTo(0, groundTop);
ctx.lineTo(W, groundTop);
ctx.stroke();
ctx.shadowBlur = 0;

// "Плитки" пола
ctx.strokeStyle = 'rgba(255,255,255,0.07)';
ctx.lineWidth = 1;
const offsetMod = groundOffset % tileW;
for (let x = -tileW + offsetMod; x < W + tileW; x += tileW) {
ctx.beginPath();
ctx.moveTo(x, groundTop);
ctx.lineTo(x, H);
ctx.stroke();
}

// Трещины
const crackColor = '#00ffcc';
const crackColor2 = '#ff00aa';
ctx.lineWidth = 1.5;
ctx.lineCap = 'round';

const scrollOffset = crackOffset % (W * 2);

cracks.forEach((crack, idx) => {
const drawX = (crack.relX - scrollOffset + W * 4) % (W * 2) - W * 0.1;
if (drawX < -100 || drawX > W + 100) return;

ctx.shadowBlur = 6;
ctx.shadowColor = idx % 3 === 0 ? crackColor2 : crackColor;
ctx.strokeStyle = idx % 3 === 0 ? crackColor2 : crackColor;

crack.segments.forEach(seg => {
ctx.beginPath();
ctx.moveTo(drawX + (seg.x1 - crack.x), groundTop + (seg.y1 - groundY));
ctx.lineTo(drawX + (seg.x2 - crack.x), groundTop + (seg.y2 - groundY));
ctx.stroke();
});
});
ctx.shadowBlur = 0;
}

// ============================================================
// ШАРИК
// ============================================================
function drawBall() {
const x = ball.x, y = ball.y, r = ballRadius;

// Тень
const shadowScale = ball.onGround ? 1 : Math.max(0.3, 1 - (groundY - ball.y) / (H * 0.35));
ctx.fillStyle = 'rgba(0,0,0,0.35)';
ctx.beginPath();
ctx.ellipse(x, groundY + 4, r * shadowScale, r * 0.3 * shadowScale, 0, 0, Math.PI * 2);
ctx.fill();

// Glow
const grd = ctx.createRadialGradient(x, y, r * 0.1, x, y, r * 2.2);
grd.addColorStop(0, 'rgba(255, 80, 200, 0.35)');
grd.addColorStop(1, 'rgba(255, 80, 200, 0)');
ctx.fillStyle = grd;
ctx.beginPath();
ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
ctx.fill();

// Тело шарика — градиент
const bodyGrd = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
bodyGrd.addColorStop(0, '#ffffff');
bodyGrd.addColorStop(0.3, '#ff50c8');
bodyGrd.addColorStop(1, '#8800cc');
ctx.fillStyle = bodyGrd;
ctx.shadowColor = '#ff50c8';
ctx.shadowBlur = 20;
ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;

// Блик
ctx.fillStyle = 'rgba(255,255,255,0.6)';
ctx.beginPath();
ctx.ellipse(x - r * 0.28, y - r * 0.3, r * 0.22, r * 0.13, -0.5, 0, Math.PI * 2);
ctx.fill();
}

// ============================================================
// ПРЕПЯТСТВИЯ
// ============================================================
function spawnObstacle() {
const w = Math.max(8, W * OBSTACLE_WIDTH_RATIO);
const h = groundY * 0.18 + Math.random() * groundY * 0.12;
const hueIdx = Math.floor(Math.random() * COLORS.length);
obstacles.push({
x: W + w,
w, h,
color: COLORS[hueIdx],
passed: false
});
}

function drawObstacles() {
obstacles.forEach(obs => {
const x = obs.x;
const y = groundY - obs.h;
const w = obs.w;
const h = obs.h;

// Свечение
ctx.shadowColor = obs.color;
ctx.shadowBlur = 18;

// Тело
const grd = ctx.createLinearGradient(x, y, x + w, y + h);
grd.addColorStop(0, '#ffffff');
grd.addColorStop(0.2, obs.color);
grd.addColorStop(1, shadeColor(obs.color, -40));
ctx.fillStyle = grd;
ctx.beginPath();
ctx.roundRect(x, y, w, h, [3, 3, 0, 0]);
ctx.fill();

// Яркая полоска сбоку
ctx.fillStyle = '#ffffff';
ctx.beginPath();
ctx.roundRect(x, y, 3, h, [3, 0, 0, 0]);
ctx.fill();

ctx.shadowBlur = 0;
});
}

function shadeColor(hex, amount) {
const r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16) + amount));
const g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16) + amount));
const b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16) + amount));
return `rgb(${r},${g},${b})`;
}

// ============================================================
// ПРЫЖОК
// ============================================================
function doJump() {
if (!gameActive) return;
if (ball.onGround) {
ball.vy = -jumpVelocity;
ball.onGround = false;
ball.canDoubleJump = true;
ball.jumpCount = 1;
playJumpSound();
} else if (ball.canDoubleJump) {
// Double jump — импульс вверх от текущей позиции
ball.vy = Math.min(ball.vy, 0) - doubleJumpVelocity;
ball.canDoubleJump = false;
ball.jumpCount = 2;
playJumpSound();
// Визуальный эффект двойного прыжка
spawnDoubleJumpParticles();
}
}

function spawnDoubleJumpParticles() {
for (let i = 0; i < 8; i++) {
const angle = Math.random() * Math.PI * 2;
const spd = 1 + Math.random() * 2.5;
particles.push({
x: ball.x + (Math.random() - 0.5) * ballRadius * 2,
y: ball.y + ballRadius,
vx: Math.cos(angle) * spd,
vy: Math.sin(angle) * spd + 1,
life: 1, decay: 0.06 + Math.random() * 0.04,
size: 2 + Math.random() * 3,
color: '#ffffff'
});
}
}

// ============================================================
// СТОЛКНОВЕНИЯ
// ============================================================
function checkCollision(obs) {
const bLeft = ball.x - ballRadius;
const bRight = ball.x + ballRadius;
const bTop = ball.y - ballRadius;
const bBottom = ball.y + ballRadius;

const oLeft = obs.x;
const oRight = obs.x + obs.w;
const oTop = groundY - obs.h;
const oBottom = groundY;

return bRight > oLeft + 2 && bLeft < oRight - 2 &&
bBottom > oTop + 2 && bTop < oBottom;
}

// ============================================================
// СЧЁТ / COMBO
// ============================================================
function addScore(pts) {
score += pts;
document.getElementById('score').textContent = score;
}

function updateComboUI() {
const el = document.getElementById('combo');
if (combo >= 3) {
el.textContent = `COMBO x${combo} 🔥`;
el.classList.add('visible');
} else {
el.classList.remove('visible');
}
}

// ============================================================
// GAME OVER
// ============================================================
function triggerGameOver() {
gameActive = false;
playDeathSound();

if (score > bestScore) bestScore = score;

document.getElementById('finalScore').textContent = `Очки: ${score}`;
document.getElementById('bestScore').textContent = `Рекорд: ${bestScore}`;
document.getElementById('gameOver').style.display = 'flex';

combo = 0;
updateComboUI();
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
function gameLoop(timestamp) {
animId = requestAnimationFrame(gameLoop);

const dt = Math.min(timestamp - (lastTime || timestamp), 50);
lastTime = timestamp;
const factor = dt / 16.67; // нормализация к 60fps

if (!gameActive) {
// Всё равно рисуем фон и землю на старт/деад скринах
renderBackground();
drawGround();
drawBall();
drawObstacles();
return;
}

// --- Скорость растёт со временем ---
speedTimer += dt;
if (speedTimer > 8000) {
speedTimer = 0;
speed = Math.min(speed + 0.12, 2.8);
groundSpeed = Math.max(3, W * 0.006) * speed;
obstacleInterval = Math.max(BEAT_MS, BEAT_MS * 2 - speed * 80);
}

// --- Фон (интерполяция) ---
bgTransition = Math.min(1, bgTransition + 0.06 * factor);

// --- Шарик физика ---
if (!ball.onGround) {
ball.vy += gravity * factor;
ball.y += ball.vy * factor;

if (ball.y >= groundY - ballRadius) {
ball.y = groundY - ballRadius;
ball.vy = 0;
ball.onGround = true;
ball.jumpCount = 0;
ball.canDoubleJump = false;
onLand();
}
}

// --- Скролл поверхности ---
groundOffset += groundSpeed * factor;
crackOffset += groundSpeed * factor;

// --- Спавн препятствий ---
if (timestamp >= nextObstacleTime) {
spawnObstacle();
nextObstacleTime = timestamp + obstacleInterval;
}

// --- Обновление препятствий ---
obstacles = obstacles.filter(obs => {
obs.x -= groundSpeed * factor;

// Проверка прохождения
if (!obs.passed && obs.x + obs.w < ball.x - ballRadius) {
obs.passed = true;
combo++;
addScore(10 + combo * 2);
updateComboUI();
}

// Столкновение
if (checkCollision(obs)) {
triggerGameOver();
}

return obs.x + obs.w > -50;
});

// --- Частицы ---
updateParticles(dt);

// --- Отрисовка ---
renderBackground();
drawGround();
drawParticles();
drawObstacles();
drawBall();
drawHUD(timestamp);
}

function onLand() {
changeBgColor();
spawnLandParticles();
playLandSound();
}

// ============================================================
// ОТРИСОВКА ФОНА
// ============================================================
function renderBackground() {
const currentBg = lerpColor(bgColor, targetBgColor, bgTransition);
if (bgTransition >= 1) bgColor = targetBgColor;

// Основной фон — вертикальный градиент
const grad = ctx.createLinearGradient(0, 0, 0, groundY);
grad.addColorStop(0, darkenColor(currentBg, 0.35));
grad.addColorStop(0.6, darkenColor(currentBg, 0.55));
grad.addColorStop(1, darkenColor(currentBg, 0.7));
ctx.fillStyle = grad;
ctx.fillRect(0, 0, W, groundY);

// Атмосферное свечение снизу
const atm = ctx.createLinearGradient(0, groundY - H * 0.25, 0, groundY);
atm.addColorStop(0, 'rgba(0,0,0,0)');
atm.addColorStop(1, 'rgba(0,0,0,0.35)');
ctx.fillStyle = atm;
ctx.fillRect(0, groundY - H * 0.25, W, H * 0.25);
}

function darkenColor(col, factor) {
let r, g, b;
if (col.startsWith('rgb')) {
[r, g, b] = col.match(/\d+/g).map(Number);
} else {
r = parseInt(col.slice(1,3),16);
g = parseInt(col.slice(3,5),16);
b = parseInt(col.slice(5,7),16);
}
return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`;
}

// ============================================================
// HUD
// ============================================================
function drawHUD(ts) {
// Битовые вспышки (пульс по BPM)
const beatPhase = (ts % BEAT_MS) / BEAT_MS;
const pulse = Math.max(0, 1 - beatPhase * 3);
if (pulse > 0) {
ctx.fillStyle = `rgba(255,255,255,${pulse * 0.04})`;
ctx.fillRect(0, 0, W, H);
}
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ ИГРЫ
// ============================================================
function initGame() {
score = 0;
combo = 0;
speed = 1;
speedTimer = 0;
groundSpeed = Math.max(3, W * 0.006);
obstacleInterval = BEAT_MS * 2;
obstacles = [];
particles = [];
bgColor = '#1a0533';
targetBgColor = '#1a0533';
bgTransition = 0;
groundOffset = 0;
crackOffset = 0;

ball.x = W * 0.22;
ball.y = groundY - ballRadius;
ball.vy = 0;
ball.onGround = true;
ball.canDoubleJump = false;
ball.jumpCount = 0;

nextObstacleTime = performance.now() + BEAT_MS * 4;

document.getElementById('score').textContent = '0';
document.getElementById('gameOver').style.display = 'none';
updateComboUI();

gameActive = true;

if (!animId) {
lastTime = 0;
animId = requestAnimationFrame(gameLoop);
}

if (audioCtx) {
nextBeatTime = audioCtx.currentTime + 0.1;
scheduleBeat();
}
}

// ============================================================
// УПРАВЛЕНИЕ
// ============================================================
function handleInteraction(e) {
if (e.type === 'touchstart') e.preventDefault();

if (!musicStarted) {
initAudio();
}

const startScreen = document.getElementById('startScreen');
if (startScreen.style.display !== 'none') return;

if (!gameActive) return;
doJump();
}

document.getElementById('startBtn').addEventListener('click', () => {
initAudio();
document.getElementById('startScreen').style.display = 'none';
initGame();
});

document.getElementById('startBtn').addEventListener('touchend', (e) => {
e.preventDefault();
initAudio();
document.getElementById('startScreen').style.display = 'none';
initGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
initAudio();
initGame();
});

document.getElementById('restartBtn').addEventListener('touchend', (e) => {
e.preventDefault();
initAudio();
initGame();
});

canvas.addEventListener('click', handleInteraction);
canvas.addEventListener('touchstart', handleInteraction, { passive: false });

document.addEventListener('keydown', (e) => {
if (e.code === 'Space' || e.code === 'ArrowUp') {
e.preventDefault();
if (!musicStarted) initAudio();
const startScreen = document.getElementById('startScreen');
if (startScreen.style.display !== 'none') return;
if (!gameActive) return;
doJump();
}
});

// ============================================================
// ЗАПУСК
// ============================================================
setupCanvas();

// Предварительный рендер (без gameActive)
animId = requestAnimationFrame(gameLoop);

// Polyfill для roundRect (старые браузеры)
if (!CanvasRenderingContext2D.prototype.roundRect) {
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
const r = Array.isArray(radii) ? radii[0] : (radii || 0);
this.beginPath();
this.moveTo(x + r, y);
this.lineTo(x + w - r, y);
this.quadraticCurveTo(x + w, y, x + w, y + r);
this.lineTo(x + w, y + h - r);
this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
this.lineTo(x + r, y + h);
this.quadraticCurveTo(x, y + h, x, y + h - r);
this.lineTo(x, y + r);
this.quadraticCurveTo(x, y, x + r, y);
this.closePath();
};
}
</script>
