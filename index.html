<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRON — Bounce Beat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#000;
  overflow:hidden;
  width:100vw; height:100vh;
  touch-action:none;
  user-select:none;
  font-family:'Courier New',monospace;
}

canvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  display:block;
}

/* ── UI ── */
#ui {
  position:fixed; top:0; left:0;
  width:100%; padding:14px 20px;
  display:flex; justify-content:space-between; align-items:flex-start;
  z-index:10; pointer-events:none;
}
#score {
  font-size:clamp(18px,4.5vw,30px);
  font-weight:900; color:#00f0ff;
  text-shadow:0 0 8px #00f0ff, 0 0 20px #00f0ff;
  letter-spacing:3px;
}
#combo {
  font-size:clamp(12px,3vw,20px);
  font-weight:700; color:#ff9900;
  text-shadow:0 0 8px #ff9900;
  opacity:0; transition:opacity .2s;
}
#combo.on { opacity:1; }
#modeBadge {
  position:fixed; bottom:18px; left:50%;
  transform:translateX(-50%);
  font-size:clamp(11px,2.5vw,16px);
  letter-spacing:3px; color:rgba(0,240,255,0.45);
  pointer-events:none; z-index:10;
}

/* ════════════════════════════════
   СТАРТОВЫЙ ЭКРАН
════════════════════════════════ */
#startScreen {
  position:fixed; inset:0;
  background:linear-gradient(180deg,#000510 0%,#000d28 60%,#000510 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0; z-index:50; overflow:hidden;
}

/* Сканлайны */
#startScreen::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(0,240,255,0.025) 2px, rgba(0,240,255,0.025) 4px
  );
  pointer-events:none; z-index:0;
}

.s-logo {
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:clamp(20px,4vh,40px);
}
.s-logo-sub {
  font-size:clamp(11px,2.5vw,15px);
  letter-spacing:8px; color:#0088aa;
  margin-bottom:6px;
}
.s-logo h1 {
  font-size:clamp(52px,12vw,100px);
  font-weight:900; letter-spacing:10px;
  color:transparent;
  background:linear-gradient(180deg,#ffffff 0%,#00f0ff 40%,#0066cc 100%);
  -webkit-background-clip:text; background-clip:text;
  text-shadow:none;
  filter:drop-shadow(0 0 18px rgba(0,240,255,0.9)) drop-shadow(0 0 40px rgba(0,100,255,0.6));
  animation:logoGlow 2.5s ease-in-out infinite alternate;
}
.s-logo-line {
  width:clamp(180px,40vw,320px); height:2px;
  background:linear-gradient(90deg,transparent,#00f0ff,transparent);
  box-shadow:0 0 12px #00f0ff;
  margin-top:8px;
}

.s-tagline {
  position:relative; z-index:1;
  font-size:clamp(11px,2.5vw,15px);
  letter-spacing:3px; color:rgba(0,240,255,0.6);
  margin-bottom:clamp(24px,5vh,44px);
  text-align:center;
}

/* Карточки режимов */
.s-modes {
  position:relative; z-index:1;
  display:flex; gap:clamp(10px,2vw,20px);
  flex-wrap:wrap; justify-content:center;
  padding:0 16px;
  margin-bottom:clamp(20px,4vh,36px);
}

.mode-card {
  width:clamp(130px,22vw,200px);
  border:1.5px solid rgba(0,240,255,0.25);
  border-radius:6px;
  padding:clamp(14px,2.5vh,22px) clamp(10px,1.5vw,18px);
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:rgba(0,20,60,0.55);
  backdrop-filter:blur(4px);
  transition:all .2s;
  position:relative; overflow:hidden;
}
.mode-card::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,240,255,0.07),transparent);
  opacity:0; transition:opacity .2s;
}
.mode-card:hover::before, .mode-card.selected::before { opacity:1; }
.mode-card:hover, .mode-card.selected {
  border-color:rgba(0,240,255,0.8);
  box-shadow:0 0 20px rgba(0,240,255,0.35), inset 0 0 20px rgba(0,240,255,0.08);
  transform:translateY(-3px);
}
.mode-card.selected { background:rgba(0,40,90,0.75); }

.mode-icon {
  font-size:clamp(22px,4vw,32px);
  line-height:1;
}
.mode-name {
  font-size:clamp(12px,2.5vw,16px);
  font-weight:900; letter-spacing:3px; color:#00f0ff;
  text-shadow:0 0 8px #00f0ff;
}
.mode-desc {
  font-size:clamp(9px,1.8vw,12px);
  color:rgba(0,240,255,0.55);
  text-align:center; letter-spacing:1px; line-height:1.5;
}
.mode-tag {
  font-size:clamp(8px,1.5vw,10px);
  letter-spacing:2px; padding:3px 8px;
  border-radius:20px; font-weight:700;
}
.tag-free  { background:rgba(0,255,136,0.18); color:#00ff88; border:1px solid #00ff88; }
.tag-easy  { background:rgba(255,153,0,0.18);  color:#ff9900; border:1px solid #ff9900; }
.tag-hard  { background:rgba(255,0,60,0.18);   color:#ff003c; border:1px solid #ff003c; }

.s-start-btn {
  position:relative; z-index:1;
  padding:clamp(12px,2vh,16px) clamp(40px,8vw,64px);
  font:900 clamp(14px,3vw,18px)/1 'Courier New',monospace;
  letter-spacing:5px; color:#000a1a;
  background:linear-gradient(135deg,#00f0ff,#0088cc);
  border:none; border-radius:4px; cursor:pointer;
  box-shadow:0 0 28px rgba(0,240,255,0.8), 0 0 60px rgba(0,120,255,0.4);
  transition:transform .15s, box-shadow .15s;
}
.s-start-btn:hover {
  transform:scale(1.05);
  box-shadow:0 0 40px rgba(0,240,255,1), 0 0 80px rgba(0,120,255,0.6);
}
.s-start-btn:active { transform:scale(0.96); }

/* Декоративные линии старт-экрана */
.s-deco-line {
  position:absolute; pointer-events:none; z-index:0;
}

/* ════════════════════════════════
   GAME OVER
════════════════════════════════ */
#dieScreen {
  position:fixed; inset:0;
  background:rgba(0,4,16,0.93);
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; z-index:50;
}
#dieScreen::before {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(255,0,60,0.03) 2px,rgba(255,0,60,0.03) 4px
  );
  pointer-events:none;
}
#dieScreen h2 {
  font-size:clamp(28px,7vw,58px);
  font-weight:900; letter-spacing:5px;
  color:#ff003c;
  text-shadow:0 0 20px #ff003c, 0 0 50px #ff003c;
  position:relative;
}
.die-stat {
  font-size:clamp(15px,3.5vw,24px);
  font-weight:700; letter-spacing:2px;
  color:#00f0ff; text-shadow:0 0 8px #00f0ff;
  position:relative;
}
.die-stat.best { color:#ff9900; text-shadow:0 0 8px #ff9900; }
.die-mode {
  font-size:clamp(10px,2vw,14px);
  letter-spacing:3px; color:rgba(0,240,255,0.45);
  position:relative;
}

.tron-btn {
  position:relative;
  padding:clamp(11px,2vh,15px) clamp(36px,7vw,56px);
  font:900 clamp(13px,2.8vw,18px)/1 'Courier New',monospace;
  letter-spacing:4px; color:#000a1a;
  background:linear-gradient(135deg,#00f0ff,#0088cc);
  border:none; border-radius:4px; cursor:pointer;
  box-shadow:0 0 22px rgba(0,240,255,0.75);
  transition:transform .15s;
  margin-top:6px;
}
.tron-btn:hover  { transform:scale(1.05); }
.tron-btn:active { transform:scale(.95); }

@keyframes logoGlow {
  from { filter:drop-shadow(0 0 14px rgba(0,240,255,.8)) drop-shadow(0 0 35px rgba(0,100,255,.5)); }
  to   { filter:drop-shadow(0 0 30px rgba(0,240,255,1))  drop-shadow(0 0 70px rgba(0,150,255,.8)); }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="combo"></div>
</div>
<div id="modeBadge"></div>

<!-- ══ СТАРТ ══ -->
<div id="startScreen">
  <!-- Декоративные лазерные линии -->
  <canvas id="decoCanvas" class="s-deco-line" style="width:100%;height:100%;position:absolute;top:0;left:0;"></canvas>

  <div class="s-logo">
    <div class="s-logo-sub">GRID PROTOCOL</div>
    <h1>TRON</h1>
    <div class="s-logo-line"></div>
  </div>

  <div class="s-tagline">BOUNCE BEAT — SELECT DIFFICULTY</div>

  <div class="s-modes">
    <div class="mode-card selected" data-mode="free" onclick="selectMode('free',this)">
      <div class="mode-icon">∞</div>
      <div class="mode-name">FREE</div>
      <div class="mode-desc">Без препятствий<br>чистый ритм</div>
      <div class="mode-tag tag-free">TRAINING</div>
    </div>
    <div class="mode-card" data-mode="easy" onclick="selectMode('easy',this)">
      <div class="mode-icon">◈</div>
      <div class="mode-name">GRID</div>
      <div class="mode-desc">Высокий прыжок<br>редкие барьеры</div>
      <div class="mode-tag tag-easy">STANDARD</div>
    </div>
    <div class="mode-card" data-mode="hard" onclick="selectMode('hard',this)">
      <div class="mode-icon">⬡</div>
      <div class="mode-name">MASTER</div>
      <div class="mode-desc">Быстрее, гуще<br>низкий прыжок</div>
      <div class="mode-tag tag-hard">MASTER</div>
    </div>
  </div>

  <button class="s-start-btn" id="btnStart">ENTER GRID</button>
</div>

<!-- ══ GAME OVER ══ -->
<div id="dieScreen">
  <h2>DEREZZED</h2>
  <div class="die-stat" id="statScore"></div>
  <div class="die-stat best" id="statBest"></div>
  <div class="die-mode" id="statMode"></div>
  <button class="tron-btn" id="btnRestart">REBOOT</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════════
const CV  = document.getElementById('c');
const CTX = CV.getContext('2d');

let W=0, H=0, GY=0, BR=0, BX=0, GR=0, JV=0, DV=0, SPD=0;

function onResize(){
  W  = CV.width  = window.innerWidth;
  H  = CV.height = window.innerHeight;
  GY = H * 0.80;
  BR = Math.max(14, Math.min(W,H)*0.07);
  BX = W * 0.28;
  applyModePhysics();
  buildFloor();
}
window.addEventListener('resize', onResize);

// ═══════════════════════════════════════════════════════════
//  РЕЖИМЫ
// ═══════════════════════════════════════════════════════════
const MODES = {
  free: {
    name       : 'FREE RIDE',
    jumpMult   : 1.55,   // высота прыжка
    djumpMult  : 1.4,
    gravMult   : 0.90,
    obsEnabled : false,
    obsInterval: 99999,
    obsMinH    : 0,
    obsMaxH    : 0,
    speedMult  : 0.85,
    accelRate  : 0,
    color      : '#00ff88'
  },
  easy: {
    name       : 'STANDARD GRID',
    jumpMult   : 1.60,   // ← значительно выше
    djumpMult  : 1.45,
    gravMult   : 0.88,
    obsEnabled : true,
    obsInterval: 2.4,    // × BEAT_MS
    obsMinH    : 0.08,   // доля от GY
    obsMaxH    : 0.14,
    speedMult  : 0.90,
    accelRate  : 0.08,
    color      : '#ff9900'
  },
  hard: {
    name       : 'MASTER CIRCUIT',
    jumpMult   : 1.15,
    djumpMult  : 1.0,
    gravMult   : 1.10,
    obsEnabled : true,
    obsInterval: 1.6,
    obsMinH    : 0.13,
    obsMaxH    : 0.22,
    speedMult  : 1.20,
    accelRate  : 0.14,
    color      : '#ff003c'
  }
};

let selectedMode = 'free';
let modeConf     = MODES.free;

function selectMode(m, el){
  selectedMode = m;
  modeConf = MODES[m];
  document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function applyModePhysics(){
  const cfg = modeConf;
  GR  = H * 0.0014  * cfg.gravMult;
  JV  = -(H * 0.022 * cfg.jumpMult);
  DV  = -(H * 0.016 * cfg.djumpMult);
  SPD = W * 0.007   * cfg.speedMult * spd;
}

// ═══════════════════════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════════════════════
let MODE_G = 'menu'; // menu | play | dead
let score=0, best={free:0,easy:0,hard:0}, combo=0;
let spd=1, spdTm=0;
let obsInt=0, nextObs=0;
let by=0, bvy=0, bOnGround=true, bCanDJ=false;
let obs=[], parts=[], floor=[];
let flOff=0;
let bgCur='#000510', bgTgt='#000510', bgT=1;
const BPM=120, BEAT_MS=60000/BPM;
let rafId=0, prevTs=0;

// ── Фоновые цвета (тёмные, Tron-палитра) ──
const BG_COLORS=[
  '#000510','#000818','#000c20','#000416','#010720',
  '#020010','#000308','#020616','#030020','#010515',
  '#080005','#100005','#0a0002','#0f0018','#060012'
];

const NEON=['#00f0ff','#ff9900','#ff003c','#00ff88','#cc33ff','#ffee00','#ff00aa','#00aaff'];

// ═══════════════════════════════════════════════════════════
//  ДЕКА-АНИМАЦИЯ НА СТАРТ ЭКРАНЕ (лазерные лучи)
// ═══════════════════════════════════════════════════════════
const DC  = document.getElementById('decoCanvas');
const DCX = DC.getContext('2d');
let decoLines=[], decoRaf=0;

function initDeco(){
  DC.width  = window.innerWidth;
  DC.height = window.innerHeight;
  decoLines = [];
  for(let i=0;i<18;i++) decoLines.push(newDecoLine());
  decoLoop();
}

function newDecoLine(){
  const side = Math.random()<0.5;
  return {
    x1: side ? 0 : DC.width,
    y1: Math.random()*DC.height,
    x2: Math.random()*DC.width,
    y2: Math.random()*DC.height,
    col: NEON[Math.floor(Math.random()*NEON.length)],
    life:0, maxLife:120+Math.random()*180,
    spd: 0.004+Math.random()*0.004
  };
}

function decoLoop(){
  if(MODE_G!=='menu'){ DCX.clearRect(0,0,DC.width,DC.height); return; }
  decoRaf=requestAnimationFrame(decoLoop);
  DCX.clearRect(0,0,DC.width,DC.height);
  decoLines.forEach((l,i)=>{
    l.life++;
    if(l.life>l.maxLife) decoLines[i]=newDecoLine();
    const progress=l.life/l.maxLife;
    const alpha=progress<0.3?progress/0.3:progress>0.7?(1-progress)/0.3:1;
    DCX.save();
    DCX.strokeStyle=l.col;
    DCX.lineWidth=1;
    DCX.globalAlpha=alpha*0.35;
    DCX.shadowColor=l.col;
    DCX.shadowBlur=8;
    DCX.beginPath();
    DCX.moveTo(l.x1,l.y1);
    DCX.lineTo(l.x2,l.y2);
    DCX.stroke();
    DCX.restore();
  });
}

// ═══════════════════════════════════════════════════════════
//  ПОЛ
// ═══════════════════════════════════════════════════════════
function buildFloor(){
  floor=[];
  const count=28;
  for(let i=0;i<count;i++){
    floor.push({
      rx   : i*(W*2/count)+Math.random()*20,
      color: NEON[Math.floor(Math.random()*NEON.length)],
      w    : 1+Math.random()*2.5
    });
  }
}

// ═══════════════════════════════════════════════════════════
//  ПЕРСПЕКТИВНАЯ СЕТКА (Tron-поверхность)
// ═══════════════════════════════════════════════════════════
let gridOff=0; // горизонтальный скролл сетки

function drawTronFloor(){
  const top=GY, bot=H;
  const vpX=W*0.5, vpY=GY; // точка схода
  const segCount=16;

  // Чёрная плоскость
  CTX.fillStyle='#000';
  CTX.fillRect(0,top,W,bot-top);

  // Вертикальные полосы (перспективные — от VP вниз)
  CTX.save();
  for(let i=0;i<=segCount;i++){
    const t  = i/segCount;
    const bx = t*W;
    const progress=(bx-vpX)/(W*0.5);
    CTX.strokeStyle=`rgba(0,240,255,${0.12+Math.abs(progress)*0.05})`;
    CTX.lineWidth=1;
    CTX.shadowColor='#00f0ff'; CTX.shadowBlur=3;
    CTX.beginPath();
    CTX.moveTo(vpX,vpY);
    CTX.lineTo(bx,bot);
    CTX.stroke();
  }

  // Горизонтальные полосы (перспективные)
  const rows=8;
  for(let r=1;r<=rows;r++){
    const depth=r/rows;
    const perspY=top+(bot-top)*Math.pow(depth,1.6);
    const alpha=0.06+depth*0.14;
    CTX.strokeStyle=`rgba(0,240,255,${alpha})`;
    CTX.lineWidth=1;
    CTX.shadowBlur=depth>0.7?6:2;
    CTX.beginPath();
    CTX.moveTo(0,perspY); CTX.lineTo(W,perspY);
    CTX.stroke();
  }
  CTX.restore();

  // Граничная линия (яркая)
  CTX.save();
  CTX.strokeStyle='#00f0ff';
  CTX.lineWidth=3;
  CTX.shadowColor='#00f0ff'; CTX.shadowBlur=20;
  CTX.beginPath(); CTX.moveTo(0,GY); CTX.lineTo(W,GY);
  CTX.stroke();
  CTX.restore();

  // Цветные вертикальные полосы (декор)
  CTX.save();
  const totalW=W*2;
  floor.forEach(t=>{
    const dx=((t.rx-flOff)%totalW+totalW)%totalW;
    if(dx>W+10) return;
    CTX.strokeStyle=t.color;
    CTX.lineWidth=t.w;
    CTX.shadowColor=t.color; CTX.shadowBlur=8;
    CTX.globalAlpha=0.7;
    CTX.beginPath();
    CTX.moveTo(dx,GY+4); CTX.lineTo(dx,H);
    CTX.stroke();
  });
  CTX.restore();
}

// ═══════════════════════════════════════════════════════════
//  ШАРИК
// ═══════════════════════════════════════════════════════════
function drawBall(){
  const x=BX, y=by, r=BR;

  // Тень на земле
  const lift=Math.max(0,GY-y-r);
  const sc=Math.max(0.1,1-lift/(H*0.4));
  CTX.save();
  CTX.globalAlpha=0.35*sc;
  CTX.fillStyle='#000';
  CTX.beginPath();
  CTX.ellipse(x,GY+5,r*sc,r*0.22*sc,0,0,Math.PI*2);
  CTX.fill();
  CTX.restore();

  // Внешний glow
  CTX.save();
  const grd=CTX.createRadialGradient(x,y,r*0.2,x,y,r*2.8);
  grd.addColorStop(0,'rgba(204,51,255,0.32)');
  grd.addColorStop(0.4,'rgba(160,0,255,0.10)');
  grd.addColorStop(1,'rgba(100,0,200,0)');
  CTX.fillStyle=grd;
  CTX.beginPath(); CTX.arc(x,y,r*2.8,0,Math.PI*2); CTX.fill();
  CTX.restore();

  // Обводка (tron-ring)
  CTX.save();
  CTX.strokeStyle='rgba(220,100,255,0.6)';
  CTX.lineWidth=3;
  CTX.shadowColor='#cc33ff'; CTX.shadowBlur=16;
  CTX.beginPath(); CTX.arc(x,y,r+4,0,Math.PI*2); CTX.stroke();
  CTX.restore();

  // Тело
  CTX.save();
  const bodyGrd=CTX.createRadialGradient(x-r*0.25,y-r*0.25,r*0.05,x,y,r);
  bodyGrd.addColorStop(0,'#ee88ff');
  bodyGrd.addColorStop(0.4,'#cc33ff');
  bodyGrd.addColorStop(1,'#660099');
  CTX.fillStyle=bodyGrd;
  CTX.shadowColor='#cc33ff'; CTX.shadowBlur=24;
  CTX.beginPath(); CTX.arc(x,y,r,0,Math.PI*2); CTX.fill();
  CTX.restore();

  // Блик
  CTX.save();
  CTX.fillStyle='rgba(255,255,255,0.55)';
  CTX.beginPath();
  CTX.ellipse(x-r*0.28,y-r*0.30,r*0.22,r*0.12,-0.5,0,Math.PI*2);
  CTX.fill();
  CTX.restore();
}

// ═══════════════════════════════════════════════════════════
//  ФОН (звёздное/сетчатое небо)
// ═══════════════════════════════════════════════════════════
let stars=[];
function initStars(){
  stars=[];
  for(let i=0;i<80;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*GY*0.9,
      r:Math.random()*1.2+0.3,
      a:Math.random()*0.6+0.2,
      flicker:Math.random()*Math.PI*2,
      fspd:0.02+Math.random()*0.03
    });
  }
}

function drawBackground(ts){
  // Основной фон
  const bgNow=bgT>=1?bgTgt:lerpClr(bgCur,bgTgt,bgT);
  if(bgT>=1) bgCur=bgTgt;

  CTX.fillStyle=bgNow;
  CTX.fillRect(0,0,W,H);

  // Вертикальный градиент поверх
  const vg=CTX.createLinearGradient(0,0,0,GY);
  vg.addColorStop(0,'rgba(0,0,0,0.6)');
  vg.addColorStop(0.6,'rgba(0,8,30,0.3)');
  vg.addColorStop(1,'rgba(0,20,60,0.15)');
  CTX.fillStyle=vg;
  CTX.fillRect(0,0,W,GY);

  // Звёзды
  if(ts){
    stars.forEach(s=>{
      s.flicker+=s.fspd;
      const a=s.a*(0.7+0.3*Math.sin(s.flicker));
      CTX.save();
      CTX.fillStyle=`rgba(180,220,255,${a})`;
      CTX.beginPath(); CTX.arc(s.x,s.y,s.r,0,Math.PI*2); CTX.fill();
      CTX.restore();
    });
  }

  // Горизонт — glow
  CTX.save();
  const hg=CTX.createLinearGradient(0,GY-H*0.12,0,GY);
  hg.addColorStop(0,'rgba(0,80,180,0)');
  hg.addColorStop(1,'rgba(0,80,255,0.18)');
  CTX.fillStyle=hg;
  CTX.fillRect(0,GY-H*0.12,W,H*0.12);
  CTX.restore();

  // Сканлайны (лёгкие)
  CTX.save();
  CTX.fillStyle='rgba(0,0,0,0.06)';
  for(let y=0;y<GY;y+=4){
    CTX.fillRect(0,y,W,2);
  }
  CTX.restore();
}

// ═══════════════════════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ═══════════════════════════════════════════════════════════
function spawnObs(){
  if(!modeConf.obsEnabled) return;
  const twin=Math.random()<0.28;
  const minH=GY*modeConf.obsMinH, maxH=GY*modeConf.obsMaxH;
  const h1=minH+Math.random()*(maxH-minH);
  const obW=Math.max(7,W*0.013);
  const c1=NEON[Math.floor(Math.random()*NEON.length)];
  obs.push({x:W+30,w:obW,h:h1,col:c1,passed:false});
  if(twin){
    const gap=obW+W*(0.04+Math.random()*0.03);
    obs.push({
      x:W+30+gap,w:obW,
      h:minH+Math.random()*(maxH-minH)*(0.7+Math.random()*0.6),
      col:NEON[Math.floor(Math.random()*NEON.length)],
      passed:false
    });
  }
}

function drawObs(){
  obs.forEach(o=>{
    const yt=GY-o.h;
    CTX.save();
    // Свечение
    CTX.shadowColor=o.col; CTX.shadowBlur=20;
    // Тело
    const gr=CTX.createLinearGradient(o.x,yt,o.x+o.w,yt+o.h);
    gr.addColorStop(0,'#fff');
    gr.addColorStop(0.15,o.col);
    gr.addColorStop(1,dimColor(o.col,0.4));
    CTX.fillStyle=gr;
    CTX.fillRect(o.x,yt,o.w,o.h);
    // Верхний торец
    CTX.shadowBlur=0;
    CTX.fillStyle='#fff';
    CTX.fillRect(o.x,yt,o.w,3);
    // Полоска-линия посередине
    CTX.strokeStyle='rgba(255,255,255,0.3)';
    CTX.lineWidth=1;
    CTX.beginPath();
    CTX.moveTo(o.x+o.w*0.5,yt+8);
    CTX.lineTo(o.x+o.w*0.5,yt+o.h-4);
    CTX.stroke();
    CTX.restore();
  });
}

function hitObs(o){
  const bL=BX-BR+5,bR=BX+BR-5;
  const bT=by-BR+5,bB=by+BR-5;
  return bR>o.x && bL<o.x+o.w && bB>GY-o.h && bT<GY;
}

function dimColor(hex,f){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${~~(r*f)},${~~(g*f)},${~~(b*f)})`;
}

// ═══════════════════════════════════════════════════════════
//  ЧАСТИЦЫ
// ═══════════════════════════════════════════════════════════
function landParticles(){
  for(let i=0;i<14;i++){
    const a=Math.PI+(Math.random()-.5)*Math.PI*0.9;
    const s=1.5+Math.random()*4.5;
    parts.push({x:BX,y:GY,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.5,
      life:1,dec:0.04+Math.random()*0.04,r:2.5+Math.random()*3.5,
      col:NEON[Math.floor(Math.random()*NEON.length)]});
  }
}
function djParticles(){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    parts.push({x:BX+(Math.random()-.5)*BR*2,y:by+BR,
      vx:Math.cos(a)*s,vy:Math.sin(a)*s+1,
      life:1,dec:0.06+Math.random()*0.05,r:2+Math.random()*3,col:'#cc33ff'});
  }
}
function drawParticles(){
  parts.forEach(p=>{
    CTX.save();
    CTX.globalAlpha=p.life;
    CTX.fillStyle=p.col;
    CTX.shadowColor=p.col; CTX.shadowBlur=10;
    CTX.beginPath(); CTX.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); CTX.fill();
    CTX.restore();
  });
}

// ═══════════════════════════════════════════════════════════
//  АУДИО
// ═══════════════════════════════════════════════════════════
let AC=null,MG=null,nextBeat=0,beatTmr=null,bassI=0;

function initAudio(){
  if(AC) return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain(); MG.gain.value=0.35; MG.connect(AC.destination);
}
function startMusic(){
  if(!AC) return;
  bassI=0; nextBeat=AC.currentTime+0.05; beatTick();
}
function stopMusic(){ if(beatTmr){clearTimeout(beatTmr);beatTmr=null;} }
function beatTick(){
  if(MODE_G!=='play') return;
  while(nextBeat<AC.currentTime+0.5){
    kick(nextBeat); bass(nextBeat);
    const bi=Math.round(nextBeat/(BEAT_MS/1000));
    if(bi%2===1) snare(nextBeat); hihat(nextBeat);
    nextBeat+=BEAT_MS/1000;
  }
  beatTmr=setTimeout(beatTick,150);
}
function osc_(type,freq,gainV,t,dur){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  o.connect(g); g.connect(MG);
  g.gain.setValueAtTime(gainV,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.01);
}
function noise_(gainV,t,dur,bpFreq){
  const len=Math.ceil(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass'; f.frequency.value=bpFreq; f.Q.value=0.8;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(MG);
  g.gain.setValueAtTime(gainV,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.start(t); s.stop(t+dur+0.01);
}
function kick(t){ osc_('sine',155,1,t,0.4); }
function snare(t){ noise_(0.28,t,0.13,1800); }
function hihat(t){ noise_(0.09,t,0.04,9000); }
const BASS=[55,55,73.4,55,65.4,55,82.4,55];
function bass(t){ osc_('sawtooth',BASS[bassI%BASS.length],0.20,t,0.28); bassI++; }

function sfxJump(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.connect(g); g.connect(MG);
  o.frequency.setValueAtTime(280,t);
  o.frequency.exponentialRampToValueAtTime(560,t+0.09);
  g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.start(t); o.stop(t+0.13);
}
function sfxLand(){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.connect(g); g.connect(MG);
  o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(70,t+0.1);
  g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.start(t); o.stop(t+0.14);
}
function sfxDie(){
  if(!AC) return;
  [200,160,120,85].forEach((f,i)=>{ osc_('sawtooth',f,0.28,AC.currentTime+i*0.1,0.18); });
}

// ═══════════════════════════════════════════════════════════
//  ПРЫЖОК
// ═══════════════════════════════════════════════════════════
function jump(){
  if(MODE_G!=='play') return;
  if(bOnGround){
    bvy=JV; bOnGround=false; bCanDJ=true; sfxJump();
  } else if(bCanDJ){
    bvy=Math.min(bvy-0.2,DV); bCanDJ=false; sfxJump(); djParticles();
  }
}

// ═══════════════════════════════════════════════════════════
//  ЦВЕТ ФОНА
// ═══════════════════════════════════════════════════════════
function randomBg(){
  let c; do{ c=BG_COLORS[Math.floor(Math.random()*BG_COLORS.length)]; }while(c===bgTgt);
  bgTgt=c; bgT=0;
}
function lerpClr(a,b,t){
  const p=s=>({r:parseInt(s.slice(1,3),16),g:parseInt(s.slice(3,5),16),b:parseInt(s.slice(5,7),16)});
  const ca=p(a),cb=p(b);
  return `rgb(${~~(ca.r+(cb.r-ca.r)*t)},${~~(ca.g+(cb.g-ca.g)*t)},${~~(ca.b+(cb.b-ca.b)*t)})`;
}

// ═══════════════════════════════════════════════════════════
//  СТАРТ / РЕСТАРТ
// ═══════════════════════════════════════════════════════════
function startGame(){
  modeConf=MODES[selectedMode];
  MODE_G='play';
  score=0; combo=0; spd=1; spdTm=0;
  obs=[]; parts=[]; flOff=0;
  obsInt=BEAT_MS*modeConf.obsInterval;
  bgCur='#000510'; bgTgt='#000510'; bgT=1;
  bassI=0;

  onResize(); // пересчёт физики через applyModePhysics
  initStars();

  by=GY-BR; bvy=0; bOnGround=true; bCanDJ=false;

  nextObs=performance.now()+BEAT_MS*3.5;

  document.getElementById('score').textContent='0';
  document.getElementById('combo').className='';
  document.getElementById('dieScreen').style.display='none';
  document.getElementById('modeBadge').textContent=modeConf.name;

  stopMusic(); startMusic();

  // Стоп deco
  if(decoRaf){ cancelAnimationFrame(decoRaf); decoRaf=0; }

  prevTs=0;
  if(!rafId) rafId=requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════
//  GAME OVER
// ═══════════════════════════════════════════════════════════
function die(){
  MODE_G='dead';
  sfxDie(); stopMusic();
  if(score>best[selectedMode]) best[selectedMode]=score;
  document.getElementById('statScore').textContent='ОЧКИ: '+score;
  document.getElementById('statBest').textContent='РЕКОРД: '+best[selectedMode];
  document.getElementById('statMode').textContent=modeConf.name;
  document.getElementById('dieScreen').style.display='flex';
}

// ═══════════════════════════════════════════════════════════
//  ГЛАВНЫЙ ЦИКЛ
// ═══════════════════════════════════════════════════════════
function loop(ts){
  rafId=requestAnimationFrame(loop);
  const dt=prevTs?Math.min(ts-prevTs,50):16;
  prevTs=ts;
  const f=dt/16.667;

  if(MODE_G==='play'){
    // Разгон (только режимы с препятствиями)
    if(modeConf.obsEnabled && modeConf.accelRate>0){
      spdTm+=dt;
      if(spdTm>9000){
        spdTm=0;
        spd=Math.min(spd+modeConf.accelRate,2.8);
        applyModePhysics();
        obsInt=Math.max(BEAT_MS*0.75,obsInt-50);
      }
    }

    // Фон
    bgT=Math.min(1,bgT+0.055*f);

    // Физика
    if(!bOnGround){
      bvy+=GR*f; by+=bvy*f;
      if(by>=GY-BR){
        by=GY-BR; bvy=0; bOnGround=true; bCanDJ=false;
        sfxLand(); landParticles(); randomBg();
        combo=0; document.getElementById('combo').className='';
      }
    }

    // Скролл
    flOff=(flOff+SPD*f)%(W*2);
    gridOff=(gridOff+SPD*f*0.5)%(W/4);

    // Препятствия
    if(ts>=nextObs){ spawnObs(); nextObs=ts+obsInt; }

    for(let i=obs.length-1;i>=0;i--){
      obs[i].x-=SPD*f;
      if(!obs[i].passed && obs[i].x+obs[i].w<BX-BR){
        obs[i].passed=true; combo++;
        score+=10+combo*2;
        document.getElementById('score').textContent=score;
        if(combo>=3){
          const el=document.getElementById('combo');
          el.textContent='COMBO ×'+combo;
          el.className='on';
        }
      }
      if(hitObs(obs[i])){ die(); return; }
      if(obs[i].x+obs[i].w<-40) obs.splice(i,1);
    }

    // Частицы
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=0.18*f;
      p.life-=p.dec*f;
      if(p.life<=0) parts.splice(i,1);
    }
  }

  render(ts);
}

// ═══════════════════════════════════════════════════════════
//  РЕНДЕР
// ═══════════════════════════════════════════════════════════
let gridOff=0;

function render(ts){
  drawBackground(ts);
  drawTronFloor();
  drawParticles();
  drawObs();
  drawBall();

  // Beat-пульс
  if(MODE_G==='play'){
    const ph=(ts%BEAT_MS)/BEAT_MS;
    const pv=Math.max(0,1-ph*5);
    if(pv>0){
      CTX.fillStyle=`rgba(0,240,255,${(pv*0.05).toFixed(3)})`;
      CTX.fillRect(0,0,W,H);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ═══════════════════════════════════════════════════════════
function onInput(e){
  if(e.type==='touchstart') e.preventDefault();
  initAudio();
  if(MODE_G==='play') jump();
}
CV.addEventListener('click',onInput);
CV.addEventListener('touchstart',onInput,{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'&&e.code!=='ArrowUp') return;
  e.preventDefault();
  initAudio();
  if(MODE_G==='play') jump();
});

document.getElementById('btnStart').addEventListener('click',e=>{
  e.stopPropagation(); initAudio();
  document.getElementById('startScreen').style.display='none';
  startGame();
});
document.getElementById('btnStart').addEventListener('touchend',e=>{
  e.preventDefault(); e.stopPropagation(); initAudio();
  document.getElementById('startScreen').style.display='none';
  startGame();
});
document.getElementById('btnRestart').addEventListener('click',e=>{
  e.stopPropagation(); initAudio(); startGame();
});
document.getElementById('btnRestart').addEventListener('touchend',e=>{
  e.preventDefault(); e.stopPropagation(); initAudio(); startGame();
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
onResize();
initStars();
by=GY-BR; bvy=0; bOnGround=true;
MODE_G='menu';

// Рендер превью + дека
rafId=requestAnimationFrame(function preview(ts){
  if(MODE_G!=='menu'){ return; }
  rafId=requestAnimationFrame(preview);
  drawBackground(ts);
  drawTronFloor();
  drawBall();
});

initDeco();
</script>
