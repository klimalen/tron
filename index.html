<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bounce Beat — Tron</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
background: #060818;
overflow: hidden;
width: 100vw;
height: 100vh;
touch-action: none;
user-select: none;
font-family: 'Courier New', monospace;
}

canvas {
position: fixed;
top: 0; left: 0;
width: 100%;
height: 100%;
display: block;
}

/* ── UI ── */
#ui {
position: fixed;
top: 0; left: 0;
width: 100%;
padding: 16px 20px;
display: flex;
justify-content: space-between;
align-items: flex-start;
z-index: 10;
pointer-events: none;
}

#score {
font-size: clamp(20px, 5vw, 34px);
font-weight: 900;
color: #00f0ff;
text-shadow: 0 0 8px #00f0ff, 0 0 20px #00f0ff;
letter-spacing: 3px;
}

#combo {
font-size: clamp(13px, 3.5vw, 22px);
font-weight: 700;
color: #ff9900;
text-shadow: 0 0 8px #ff9900;
transition: opacity .2s;
opacity: 0;
}
#combo.on { opacity: 1; }

/* ── Стартовый экран ── */
#startScreen {
position: fixed;
inset: 0;
background: rgba(4, 6, 20, 0.95);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 20px;
z-index: 50;
}

#startScreen h1 {
font-size: clamp(38px, 9vw, 72px);
font-weight: 900;
color: #00f0ff;
letter-spacing: 6px;
text-shadow: 0 0 16px #00f0ff, 0 0 40px #00f0ff, 0 0 80px #0066ff;
animation: glow 2s ease-in-out infinite alternate;
}

#startScreen p {
font-size: clamp(13px, 3vw, 18px);
color: rgba(0,240,255,0.72);
text-align: center;
line-height: 1.8;
letter-spacing: 1px;
padding: 0 24px;
}

.btn {
padding: 14px 52px;
font: 900 clamp(15px,3.5vw,20px)/1 'Courier New', monospace;
letter-spacing: 4px;
color: #060818;
background: #00f0ff;
border: none;
border-radius: 4px;
cursor: pointer;
box-shadow: 0 0 24px #00f0ff, 0 0 50px #00f0ff;
transition: transform .15s, box-shadow .15s;
pointer-events: auto;
}
.btn:hover { transform: scale(1.06); box-shadow: 0 0 40px #00f0ff, 0 0 80px #00f0ff; }
.btn:active { transform: scale(.95); }

/* ── Game Over ── */
#dieScreen {
position: fixed;
inset: 0;
background: rgba(4, 6, 20, 0.93);
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 16px;
z-index: 50;
}
#dieScreen h2 {
font-size: clamp(32px, 8vw, 64px);
font-weight: 900;
color: #ff003c;
letter-spacing: 4px;
text-shadow: 0 0 18px #ff003c, 0 0 50px #ff003c;
}
.stat {
font-size: clamp(16px,4vw,26px);
font-weight: 700;
letter-spacing: 2px;
color: #00f0ff;
text-shadow: 0 0 8px #00f0ff;
}
.stat.best { color:#ff9900; text-shadow:0 0 8px #ff9900; }

@keyframes glow {
from { text-shadow: 0 0 12px #00f0ff, 0 0 30px #00f0ff; }
to { text-shadow: 0 0 28px #00f0ff, 0 0 70px #00f0ff, 0 0 120px #0055ff; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
<div id="score">0</div>
<div id="combo"></div>
</div>

<div id="startScreen">
<h1>BOUNCE<br>BEAT</h1>
<p>
Перепрыгивай линии в ритм<br>
<span style="color:#ff9900">КЛИК / ПРОБЕЛ / ТАП</span> — прыжок<br>
<span style="color:#cc33ff">ЕЩЁ РАЗ В ВОЗДУХЕ</span> — двойной прыжок
</p>
<button class="btn" id="btnStart">СТАРТ</button>
</div>

<div id="dieScreen">
<h2>GAME OVER</h2>
<div class="stat" id="statScore"></div>
<div class="stat best" id="statBest"></div>
<button class="btn" id="btnRestart">СНОВА</button>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CANVAS
// ─────────────────────────────────────────────────────────────
const CV = document.getElementById('c');
const CTX = CV.getContext('2d');

let W = 0, H = 0;
// Игровые координаты (пересчитываются при resize)
let GY; // Y верхней грани земли
let BR; // радиус шарика
let BX; // X шарика (фиксированный)
let GR; // сила гравитации
let JV; // начальная скорость прыжка (отрицательная)
let DV; // скорость double-jump
let SPD; // скорость движения земли px/frame

function onResize() {
W = CV.width = window.innerWidth;
H = CV.height = window.innerHeight;
GY = H * 0.80;
BR = Math.max(14, Math.min(W, H) * 0.07);
BX = W * 0.28;
GR = H * 0.0014;
JV = -(H * 0.022);
DV = -(H * 0.016);
SPD = W * 0.007 * spd;

// Перестроить плитки пола при смене размера
buildFloor();
}
window.addEventListener('resize', onResize);

// ─────────────────────────────────────────────────────────────
// ГЛОБАЛЬНОЕ СОСТОЯНИЕ
// ─────────────────────────────────────────────────────────────
// Режимы: 'menu' | 'play' | 'dead'
let MODE = 'menu';

let score = 0, best = 0, combo = 0;
let spd = 1; // множитель скорости
let spdTm = 0; // таймер разгона
let obsInt = 0; // интервал появления препятствий (мс)
let nextObs = 0; // timestamp следующего препятствия

// Шарик
let by = 0, bvy = 0, bOnGround = true, bCanDJ = false;

// Объекты
let obs = []; // препятствия
let parts = []; // частицы
let floor = []; // декоративные вертикальные черты

// Скролл
let flOff = 0; // смещение пола

// Фон
const BG_BASE = '#060e24';
let bgCur = BG_BASE, bgTgt = BG_BASE, bgT = 1;

const BG_COLORS = [
'#060e24','#080f1f','#05101a','#080520','#06101c',
'#0a0420','#06080f','#0f0520','#030a18','#070316',
'#0a1228','#050c22','#060215','#090e20','#040812'
];

const NEON = ['#00f0ff','#ff9900','#ff003c','#00ff88','#cc33ff','#ffee00'];

// BPM
const BPM = 120;
const BEAT_MS = 60000 / BPM;

// rAF
let rafId = 0;
let prevTs = 0;

// ─────────────────────────────────────────────────────────────
// ПОЛ — ДЕКОРАТИВНЫЕ ПОЛОСЫ
// ─────────────────────────────────────────────────────────────
function buildFloor() {
floor = [];
const count = 24;
for (let i = 0; i < count; i++) {
floor.push({
rx : i * (W * 2 / count) + Math.random() * 30, // относительный X
color: NEON[Math.floor(Math.random() * NEON.length)],
w : 1.5 + Math.random() * 2
});
}
}

// ─────────────────────────────────────────────────────────────
// АУДИО
// ─────────────────────────────────────────────────────────────
let AC = null, MG = null, nextBeat = 0, beatTmr = null, bassI = 0;

function initAudio() {
if (AC) return;
AC = new (window.AudioContext || window.webkitAudioContext)();
MG = AC.createGain(); MG.gain.value = 0.35; MG.connect(AC.destination);
}

function startMusic() {
if (!AC) return;
bassI = 0;
nextBeat = AC.currentTime + 0.05;
beatTick();
}

function stopMusic() {
if (beatTmr) { clearTimeout(beatTmr); beatTmr = null; }
}

function beatTick() {
if (MODE !== 'play') return;
while (nextBeat < AC.currentTime + 0.5) {
kick(nextBeat);
bass(nextBeat);
const bi = Math.round(nextBeat / (BEAT_MS/1000));
if (bi % 2 === 1) snare(nextBeat);
hihat(nextBeat);
nextBeat += BEAT_MS / 1000;
}
beatTmr = setTimeout(beatTick, 150);
}

function osc(type, freq, gainVal, t, dur) {
const o = AC.createOscillator(), g = AC.createGain();
o.type = type; o.frequency.value = freq;
o.connect(g); g.connect(MG);
g.gain.setValueAtTime(gainVal, t);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.start(t); o.stop(t + dur + 0.01);
}

function noise(gainVal, t, dur, bpFreq) {
const len = Math.ceil(AC.sampleRate * dur);
const buf = AC.createBuffer(1, len, AC.sampleRate);
const d = buf.getChannelData(0);
for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
const s = AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
f.type='bandpass'; f.frequency.value=bpFreq; f.Q.value=0.8;
s.buffer=buf; s.connect(f); f.connect(g); g.connect(MG);
g.gain.setValueAtTime(gainVal,t);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
s.start(t); s.stop(t+dur+0.01);
}

function kick(t) { osc('sine','155',1,t,0.4); }
function snare(t) { noise(0.28,t,0.13,1800); }
function hihat(t) { noise(0.09,t,0.04,9000); }

const BASS_NOTES = [55,55,73.4,55,65.4,55,82.4,55];
function bass(t) {
osc('sawtooth', BASS_NOTES[bassI % BASS_NOTES.length], 0.20, t, 0.28);
bassI++;
}

function sfxJump() {
if (!AC) return;
const t = AC.currentTime;
osc('sine',280,0.18,t,0.01);
const o=AC.createOscillator(),g=AC.createGain();
o.type='sine'; o.connect(g); g.connect(MG);
o.frequency.setValueAtTime(280,t);
o.frequency.exponentialRampToValueAtTime(560,t+0.09);
g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
o.start(t); o.stop(t+0.13);
}

function sfxLand() {
if (!AC) return;
const t=AC.currentTime;
const o=AC.createOscillator(),g=AC.createGain();
o.type='sine'; o.connect(g); g.connect(MG);
o.frequency.setValueAtTime(180,t);
o.frequency.exponentialRampToValueAtTime(70,t+0.1);
g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
o.start(t); o.stop(t+0.14);
}

function sfxDie() {
if (!AC) return;
[200,160,120,85].forEach((f,i)=>{
const t=AC.currentTime+i*0.1;
osc('sawtooth',f,0.28,t,0.18);
});
}

// ─────────────────────────────────────────────────────────────
// ПРЫЖОК
// ─────────────────────────────────────────────────────────────
function jump() {
if (MODE !== 'play') return;
if (bOnGround) {
bvy = JV; bOnGround = false; bCanDJ = true;
sfxJump();
} else if (bCanDJ) {
bvy = Math.min(bvy - 0.2, DV); bCanDJ = false;
sfxJump();
djParticles();
}
}

// ─────────────────────────────────────────────────────────────
// ЧАСТИЦЫ
// ─────────────────────────────────────────────────────────────
function landParticles() {
for (let i=0;i<12;i++) {
const a = Math.PI + (Math.random()-.5)*Math.PI*0.85;
const s = 1.5 + Math.random()*4;
parts.push({
x:BX, y:GY, vx:Math.cos(a)*s, vy:Math.sin(a)*s-0.5,
life:1, dec:0.04+Math.random()*0.04,
r:2.5+Math.random()*3,
col: NEON[Math.floor(Math.random()*NEON.length)]
});
}
}

function djParticles() {
for (let i=0;i<8;i++) {
const a = Math.random()*Math.PI*2;
const s = 1+Math.random()*2.5;
parts.push({
x:BX+(Math.random()-.5)*BR*1.6, y:by+BR,
vx:Math.cos(a)*s, vy:Math.sin(a)*s+1,
life:1, dec:0.07+Math.random()*0.05,
r:2+Math.random()*2.5,
col:'#cc33ff'
});
}
}

// ─────────────────────────────────────────────────────────────
// ПРЕПЯТСТВИЯ
// ─────────────────────────────────────────────────────────────
function spawnObs() {
const twin = Math.random() < 0.3;
const h1 = GY * (0.13 + Math.random()*0.11);
const obW = Math.max(7, W * 0.014);
const c1 = NEON[Math.floor(Math.random()*NEON.length)];
obs.push({ x:W+30, w:obW, h:h1, col:c1, passed:false });
if (twin) {
const gap = obW + W*(0.04+Math.random()*0.03);
obs.push({
x:W+30+gap, w:obW,
h:h1*(0.75+Math.random()*0.5),
col:NEON[Math.floor(Math.random()*NEON.length)],
passed:false
});
}
}

function hitObs(o) {
const bL = BX - BR + 5, bR = BX + BR - 5;
const bT = by - BR + 5, bB = by + BR - 5;
const oT = GY - o.h;
return bR > o.x && bL < o.x + o.w && bB > oT && bT < GY;
}

// ─────────────────────────────────────────────────────────────
// ЗАПУСК / РЕСТАРТ ИГРЫ
// ─────────────────────────────────────────────────────────────
function startGame() {
MODE = 'play';
score = 0; combo = 0; spd = 1; spdTm = 0;
obs = []; parts = []; flOff = 0;
obsInt = BEAT_MS * 2;
bgCur = BG_BASE; bgTgt = BG_BASE; bgT = 1;
bassI = 0;

// пересчитать размеры (на случай ресайза)
onResize();

by = GY - BR; bvy = 0; bOnGround = true; bCanDJ = false;
SPD = W * 0.007;

nextObs = performance.now() + BEAT_MS * 3;

document.getElementById('score').textContent = '0';
document.getElementById('combo').className = '';
document.getElementById('dieScreen').style.display = 'none';

stopMusic();
startMusic();
}

// ─────────────────────────────────────────────────────────────
// GAME OVER
// ─────────────────────────────────────────────────────────────
function die() {
MODE = 'dead';
sfxDie();
stopMusic();
if (score > best) best = score;
document.getElementById('statScore').textContent = 'ОЧКИ: ' + score;
document.getElementById('statBest').textContent = 'РЕКОРД: ' + best;
document.getElementById('dieScreen').style.display = 'flex';
}

// ─────────────────────────────────────────────────────────────
// ЦВЕТ ФОНА
// ─────────────────────────────────────────────────────────────
function randomBg() {
let c; do { c = BG_COLORS[Math.floor(Math.random()*BG_COLORS.length)]; } while(c===bgTgt);
bgTgt = c; bgT = 0;
}

function lerpClr(a, b, t) {
const p = s => ({ r:parseInt(s.slice(1,3),16), g:parseInt(s.slice(3,5),16), b:parseInt(s.slice(5,7),16) });
const ca=p(a), cb=p(b);
return `rgb(${~~(ca.r+(cb.r-ca.r)*t)},${~~(ca.g+(cb.g-ca.g)*t)},${~~(ca.b+(cb.b-ca.b)*t)})`;
}

// ─────────────────────────────────────────────────────────────
// ГЛАВНЫЙ ЦИКЛ
// ─────────────────────────────────────────────────────────────
function loop(ts) {
rafId = requestAnimationFrame(loop);

const dt = prevTs ? Math.min(ts - prevTs, 50) : 16;
prevTs = ts;
const f = dt / 16.667; // нормировка к 60fps

// ── ОБНОВЛЕНИЕ (только в режиме play) ──
if (MODE === 'play') {

// Разгон
spdTm += dt;
if (spdTm > 8000) {
spdTm = 0;
spd = Math.min(spd + 0.12, 2.8);
SPD = W * 0.007 * spd;
obsInt = Math.max(BEAT_MS * 0.8, obsInt - 55);
}

// Фон
bgT = Math.min(1, bgT + 0.055 * f);

// Физика шарика
if (!bOnGround) {
bvy += GR * f;
by += bvy * f;
if (by >= GY - BR) {
by = GY - BR; bvy = 0; bOnGround = true; bCanDJ = false;
sfxLand(); landParticles(); randomBg();
combo = 0;
document.getElementById('combo').className = '';
}
}

// Скролл
flOff = (flOff + SPD * f) % (W * 2);

// Спавн препятствий
if (ts >= nextObs) { spawnObs(); nextObs = ts + obsInt; }

// Препятствия
for (let i = obs.length - 1; i >= 0; i--) {
obs[i].x -= SPD * f;
if (!obs[i].passed && obs[i].x + obs[i].w < BX - BR) {
obs[i].passed = true;
combo++;
score += 10 + combo * 2;
document.getElementById('score').textContent = score;
if (combo >= 3) {
const el = document.getElementById('combo');
el.textContent = 'COMBO ×' + combo;
el.className = 'on';
}
}
if (hitObs(obs[i])) { die(); return; }
if (obs[i].x + obs[i].w < -40) obs.splice(i, 1);
}

// Частицы
for (let i = parts.length - 1; i >= 0; i--) {
const p = parts[i];
p.x += p.vx * f; p.y += p.vy * f; p.vy += 0.18 * f;
p.life -= p.dec * f;
if (p.life <= 0) parts.splice(i, 1);
}
}

// ── РИСОВАНИЕ (всегда) ──
render(ts);
}

// ─────────────────────────────────────────────────────────────
// РЕНДЕР
// ─────────────────────────────────────────────────────────────
function render(ts) {
// Фон
const bg = bgT >= 1 ? bgTgt : lerpClr(bgCur, bgTgt, bgT);
if (bgT >= 1) bgCur = bgTgt;
CTX.fillStyle = bg;
CTX.fillRect(0, 0, W, H);

drawGrid();
drawGround();
drawParticles();
drawObs();
drawBall();

// Beat-пульс
if (MODE === 'play') {
const ph = (ts % BEAT_MS) / BEAT_MS;
const pv = Math.max(0, 1 - ph * 5);
if (pv > 0) {
CTX.fillStyle = `rgba(0,240,255,${(pv * 0.06).toFixed(3)})`;
CTX.fillRect(0, 0, W, H);
}
}
}

function drawGrid() {
CTX.save();
CTX.strokeStyle = 'rgba(0,240,255,0.045)';
CTX.lineWidth = 1;
const step = Math.round(W / 12);
CTX.beginPath();
for (let x = 0; x <= W; x += step) { CTX.moveTo(x,0); CTX.lineTo(x,GY); }
for (let y = 0; y <= GY; y += step) { CTX.moveTo(0,y); CTX.lineTo(W,y); }
CTX.stroke();
CTX.restore();
}

function drawGround() {
// Чёрная плоскость
CTX.fillStyle = '#000000';
CTX.fillRect(0, GY, W, H - GY);

// Граница (tron-линия)
CTX.save();
CTX.strokeStyle = '#00f0ff';
CTX.lineWidth = 3;
CTX.shadowColor = '#00f0ff';
CTX.shadowBlur = 16;
CTX.beginPath();
CTX.moveTo(0, GY); CTX.lineTo(W, GY);
CTX.stroke();
CTX.restore();

// Вертикальные цветные полосы
CTX.save();
const totalW = W * 2;
floor.forEach(t => {
const dx = ((t.rx - flOff) % totalW + totalW) % totalW;
if (dx > W + 10) return;
CTX.strokeStyle = t.col;
CTX.lineWidth = t.w;
CTX.shadowColor = t.col;
CTX.shadowBlur = 7;
CTX.beginPath();
CTX.moveTo(dx, GY + 5);
CTX.lineTo(dx, H);
CTX.stroke();
});
CTX.restore();
}

function drawBall() {
const x = BX, y = by, r = BR;

// Тень на земле
const lift = Math.max(0, GY - y - r);
const sc = Math.max(0.12, 1 - lift / (H * 0.42));
CTX.save();
CTX.globalAlpha = 0.38 * sc;
CTX.fillStyle = '#000';
CTX.beginPath();
CTX.ellipse(x, GY + 4, r * sc, r * 0.22 * sc, 0, 0, Math.PI*2);
CTX.fill();
CTX.restore();

// Glow
CTX.save();
const grd = CTX.createRadialGradient(x,y,r*0.3,x,y,r*2.5);
grd.addColorStop(0, 'rgba(204,51,255,0.28)');
grd.addColorStop(0.5, 'rgba(204,51,255,0.08)');
grd.addColorStop(1, 'rgba(204,51,255,0)');
CTX.fillStyle = grd;
CTX.beginPath(); CTX.arc(x,y,r*2.5,0,Math.PI*2); CTX.fill();
CTX.restore();

// Тело — ровный круг (как в референсе)
CTX.save();
CTX.fillStyle = '#cc33ff';
CTX.shadowColor = '#dd55ff';
CTX.shadowBlur = 22;
CTX.beginPath(); CTX.arc(x,y,r,0,Math.PI*2); CTX.fill();
CTX.restore();

// Контур
CTX.save();
CTX.strokeStyle = 'rgba(255,255,255,0.22)';
CTX.lineWidth = 2;
CTX.beginPath(); CTX.arc(x,y,r,0,Math.PI*2); CTX.stroke();
CTX.restore();
}

function drawObs() {
obs.forEach(o => {
const yt = GY - o.h;
CTX.save();
CTX.fillStyle = o.col;
CTX.shadowColor = o.col;
CTX.shadowBlur = 18;
CTX.fillRect(o.x, yt, o.w, o.h);
// белый торец
CTX.fillStyle = '#fff';
CTX.shadowBlur = 0;
CTX.fillRect(o.x, yt, o.w, 3);
CTX.restore();
});
}

function drawParticles() {
parts.forEach(p => {
CTX.save();
CTX.globalAlpha = p.life;
CTX.fillStyle = p.col;
CTX.shadowColor = p.col;
CTX.shadowBlur = 8;
CTX.beginPath();
CTX.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
CTX.fill();
CTX.restore();
});
}

// ─────────────────────────────────────────────────────────────
// УПРАВЛЕНИЕ
// ─────────────────────────────────────────────────────────────
function onInput(e) {
if (e.type === 'touchstart') e.preventDefault();
initAudio();
if (MODE === 'play') jump();
}

CV.addEventListener('click', onInput);
CV.addEventListener('touchstart', onInput, { passive: false });

document.addEventListener('keydown', e => {
if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
e.preventDefault();
initAudio();
if (MODE === 'play') jump();
});

document.getElementById('btnStart').addEventListener('click', e => {
e.stopPropagation();
initAudio();
document.getElementById('startScreen').style.display = 'none';
startGame();
});

document.getElementById('btnRestart').addEventListener('click', e => {
e.stopPropagation();
initAudio();
startGame();
});

// touch-варианты кнопок
['btnStart','btnRestart'].forEach(id => {
document.getElementById(id).addEventListener('touchend', e => {

}
startGame();
});
